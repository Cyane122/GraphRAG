<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphRAG — Live Narrative</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./style.css?v=20260706a" />
  <link rel="stylesheet" href="./design-v2.css?v=20260721a" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">GR</div>
          <div class="brand-copy">
            <strong>GraphRAG</strong>
            <span>LIVE NARRATIVE</span>
          </div>
        </div>
        <button class="icon-button" id="closeSidebarBtn" aria-label="사이드바 닫기">
          ✕
        </button>
      </div>

      <button class="new-chat-button" id="newChatBtn">
        <span aria-hidden="true">＋</span>
        새 스레드
      </button>

      <div class="sidebar-section-label">RECENT THREADS</div>
      <nav class="conversation-list" aria-label="대화 목록">
      </nav>

      <div class="sidebar-footer">
        <button class="utility-button" id="settingsBtn">
          <span aria-hidden="true">⌘</span>
          환경 설정
        </button>
        <button class="utility-button" id="themeToggleBtn">
          <span id="themeIcon">☾</span>
          화면 테마
        </button>
      </div>
    </aside>

    <main class="chat-panel">
      <div class="right-rail" aria-label="오른쪽 사이드바 도구">
        <button class="right-rail-button" type="button" data-inspector-action="schema">구조</button>
        <button class="right-rail-button" type="button" data-inspector-action="locations">장면</button>
      </div>

      <header class="chat-header">
        <button class="icon-button desktop-hidden" id="openSidebarBtn" aria-label="사이드바 열기">
          ☰
        </button>

        <div class="header-context">
          <span class="header-eyebrow">ACTIVE STORY</span>
          <div class="profile-selector" id="profileSelector">
            <div class="profile-dropdown" id="worldDropdown">
              <button class="profile-trigger" id="worldTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span id="worldLabel">babe_univ</span>
              </button>
              <div class="profile-menu" id="worldMenu" role="listbox"></div>
            </div>

            <span class="profile-separator">/</span>

            <div class="profile-dropdown" id="scenarioDropdown">
              <button class="profile-trigger" id="scenarioTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span id="scenarioLabel">default</span>
              </button>
              <div class="profile-menu scenario-menu" id="scenarioMenu" role="listbox"></div>
            </div>
          </div>
        </div>

        <div class="engine-status" id="engineStatus" data-state="connecting" role="status" aria-live="polite">
          <span class="engine-status-dot" aria-hidden="true"></span>
          <span id="engineStatusText">엔진 연결 중</span>
        </div>

        <div class="header-tools" aria-label="월드 도구">
          <button class="header-tool-button" id="schemaPanelBtn" type="button">세계 구조</button>
          <button class="header-tool-button" id="locationPanelBtn" type="button">장면 보드</button>
        </div>
      </header>

      <div class="workspace">
        <section class="message-scroll" id="messageScroll" aria-live="polite">
          <div class="date-divider">
            <span>오늘</span>
          </div>
        </section>

        <aside class="inspector-panel" id="inspectorPanel" aria-live="polite">
          <div class="inspector-header">
            <div>
              <strong id="inspectorTitle">스키마</strong>
              <span id="inspectorMeta">현재 스레드</span>
            </div>
            <button class="icon-button" id="closeInspectorBtn" type="button" aria-label="패널 닫기">✕</button>
          </div>
          <div class="inspector-body" id="inspectorBody"></div>
        </aside>
      </div>

      <footer class="composer-wrap">
        <div class="composer-toolbar">
          <span class="composer-toolbar-label">DIRECTIVES</span>
          <button class="chip-button" id="oocConfigBtn" type="button">OOC</button>
          <button class="chip-button" id="usernotesBtn" type="button">유저 노트</button>
          <button class="chip-button" id="forcePregnancyBtn" type="button">강제 임신</button>
          <button class="chip-button" id="simPregnancyBtn" type="button">질내사정</button>
        </div>

        <form class="composer" id="chatForm">
          <div class="profile-dropdown composer-model-wrap" id="actorModelDropdown">
            <button class="composer-model-btn" id="actorModelTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="actorModelLabel">Gemini 3.1 Pro Preview</span>
            </button>
            <div class="profile-menu model-menu composer-model-menu" id="actorModelMenu" role="listbox"></div>
          </div>
          <textarea
            id="messageInput"
            rows="1"
            placeholder="이 장면에서 무엇을 할까요?"
            autocomplete="off"
          ></textarea>
          <button class="send-button" id="sendBtn" type="submit" aria-label="메시지 보내기">
            <span>↑</span>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <!-- 앱 설정 모달 -->
  <div class="modal-overlay" id="settingsModal" aria-modal="true" role="dialog" aria-label="설정" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <strong>설정</strong>
        <button class="icon-button modal-close" id="settingsModalClose" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <label class="settings-row">
          <span class="settings-row-label">
            Output Repair
            <small class="settings-row-desc">응답의 금지어·POV 위반을 LLM으로 자동 수정합니다.</small>
          </span>
          <input type="checkbox" id="outputRepairToggle" class="settings-toggle" />
        </label>
        <div class="settings-row" style="cursor:default">
          <span class="settings-row-label">본문 글꼴</span>
          <select id="fontSelect" class="font-select" aria-label="본문 글꼴">
            <option value="gothic">고딕</option>
            <option value="serif">명조</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- OOC 설정 모달 -->
  <div class="modal-overlay" id="oocModal" aria-modal="true" role="dialog" aria-label="OOC 설정" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <strong>OOC 설정</strong>
        <button class="icon-button modal-close" id="oocModalClose" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">매 입력마다 Player Input과 분리된 턴 지시 블록으로 추가됩니다.</p>
        <textarea id="oocConfigTextarea" class="modal-textarea" placeholder="Out Of Character: 이 소설은 반드시 1인칭으로 서술합니다."></textarea>
      </div>
      <div class="modal-footer">
        <button class="edit-button cancel" id="oocModalCancel" type="button">취소</button>
        <button class="edit-button save" id="oocModalSave" type="button">저장</button>
      </div>
    </div>
  </div>

  <!-- 유저노트 모달 -->
  <div class="modal-overlay" id="usernotesModal" aria-modal="true" role="dialog" aria-label="유저노트" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <strong id="usernotesModalTitle">유저노트</strong>
        <div class="modal-header-right">
          <button class="icon-button" id="usernoteNewBtn" type="button" aria-label="새 노트" title="새 노트">＋</button>
          <button class="icon-button modal-close" id="usernotesModalClose" type="button" aria-label="닫기">✕</button>
        </div>
      </div>
      <!-- 목록 화면 -->
      <div id="usernoteListView">
        <div class="modal-body usernote-list" id="usernoteList"></div>
      </div>
      <!-- 상세 화면 -->
      <div id="usernoteDetailView" hidden>
        <div class="modal-body">
          <div class="usernote-detail-toggle-row">
            <label class="toggle-label">활성화</label>
            <button class="toggle-btn" id="usernoteToggleBtn" type="button" role="switch" aria-checked="true"></button>
          </div>
          <input id="usernoteNameInput" class="modal-input" type="text" placeholder="노트 제목" />
          <textarea id="usernoteContentTextarea" class="modal-textarea usernote-content-area" placeholder="노트 내용을 입력하세요..."></textarea>
        </div>
        <div class="modal-footer">
          <button class="edit-button cancel" id="usernoteDeleteBtn" type="button" style="color:var(--danger)">삭제</button>
          <div style="display:flex;gap:8px">
            <button class="edit-button cancel" id="usernoteDetailCancel" type="button">취소</button>
            <button class="edit-button save" id="usernoteDetailSave" type="button">저장</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 강제 임신 모달 -->
  <div class="modal-overlay" id="forcePregnancyModal" aria-modal="true" role="dialog" aria-label="강제 임신" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <strong>강제 임신</strong>
        <button class="icon-button modal-close" id="forcePregnancyModalClose" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">확률을 무시하고 엄마(캐릭터 B)를 아빠(캐릭터 A)의 아이로 즉시 임신시킵니다.</p>
        <label class="preg-field-label" for="forcePregMother">엄마 (임신할 캐릭터)</label>
        <select id="forcePregMother" class="modal-input preg-select"></select>
        <label class="preg-field-label" for="forcePregFather">아빠 (선택)</label>
        <select id="forcePregFather" class="modal-input preg-select"></select>
      </div>
      <div class="modal-footer">
        <button class="edit-button cancel" id="forcePregnancyCancel" type="button">취소</button>
        <button class="edit-button save" id="forcePregnancyRun" type="button">임신시키기</button>
      </div>
    </div>
  </div>

  <!-- 질내사정 시뮬레이션 모달 -->
  <div class="modal-overlay" id="simPregnancyModal" aria-modal="true" role="dialog" aria-label="질내사정 시뮬레이션" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <strong>질내사정 시뮬레이션</strong>
        <button class="icon-button modal-close" id="simPregnancyModalClose" type="button" aria-label="닫기">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">N회 질내사정을 가정해 가임 주기 기반 확률로 임신 여부를 판정합니다. 임신으로 나오면 상태가 반영됩니다.</p>
        <label class="preg-field-label" for="simPregMother">엄마 (임신할 캐릭터)</label>
        <select id="simPregMother" class="modal-input preg-select"></select>
        <label class="preg-field-label" for="simPregFather">아빠 (선택)</label>
        <select id="simPregFather" class="modal-input preg-select"></select>
        <label class="preg-field-label" for="simPregShots">질내사정 횟수</label>
        <input id="simPregShots" class="modal-input" type="number" min="1" max="999" value="1" />
      </div>
      <div class="modal-footer">
        <button class="edit-button cancel" id="simPregnancyCancel" type="button">취소</button>
        <button class="edit-button save" id="simPregnancyRun" type="button">시뮬레이션</button>
      </div>
    </div>
  </div>

  <script src="./app.js?v=20260721a"></script>
</body>
</html>
