   PROMPTS  (#4 tree, #5 load, #6 save)
   ═══════════════════════════════════════════════════════════════════════ */
function renderPrompts(){
  const p = curPrompts();
  const b = curBundle();
  if(!p){
    sectionPane.innerHTML = `<div class="pane-inner">
      <div class="error-card"><div class="ec-title">⚠ 프롬프트 트리 로드 실패</div>
      <div class="ec-body">${esc(b?.promptError||"알 수 없는 오류")}</div></div>
    </div>`;
    return;
  }
  // Full-bleed two-pane layout
  sectionPane.style.padding = "0";
  sectionPane.innerHTML = `
    <div class="prompt-layout">
      <div class="tree-panel">
        <div class="tree-head">
          <span>프롬프트 트리</span>
          <span style="display:flex;gap:6px">
            <button class="btn btn-sm" id="prompt-new-file" type="button">＋ 파일</button>
            <button class="btn btn-sm" id="prompt-new-dir" type="button">＋ 폴더</button>
          </span>
        </div>
        <div class="tree-scroll" id="tree-scroll"></div>
      </div>
      <div class="editor-panel" id="editor-panel"></div>
    </div>`;
  $("prompt-new-file").addEventListener("click", ()=>openPromptCreateModal(false));
  $("prompt-new-dir").addEventListener("click", ()=>openPromptCreateModal(true));
  renderTree();
  renderPromptEditor();
}

function renderTree(){
  const p = curPrompts();
  const host = $("tree-scroll");
  let html = "";
  if(p.warnings && p.warnings.length){
    html += `<div class="banner banner-warn" style="margin:8px 6px 12px"><span class="banner-icon">⚠</span>
      <div><b>경고</b><ul>${p.warnings.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div></div>`;
  }
  if(p.scene_types && p.scene_types.length){
    html += `<div style="padding:4px 8px 10px"><div class="flabel" style="margin-bottom:6px">씬 타입 (${p.scene_types.length})</div>
      <div class="chip-row">${p.scene_types.map(s=>`<span class="chip chip-scn">${esc(s)}</span>`).join("")}</div></div>`;
  }
  html += (p.nodes||[]).map(n=>renderTreeNode(n,0)).join("");
  host.innerHTML = html || `<div class="state-box" style="padding:30px"><div class="state-text">파일 없음</div></div>`;
  host.querySelectorAll("[data-tree-toggle]").forEach(el=>{
    el.addEventListener("click", e=>{
      e.stopPropagation();
      const path=el.dataset.treeToggle;
      state.promptDir = path;
      if(!e.target.closest("[data-tree-dir-delete]")) state.treeOpen[path]=!state.treeOpen[path];
      renderTree();
    });
  });
  host.querySelectorAll("[data-tree-dir-delete]").forEach(btn=>{
    btn.addEventListener("click", e=>{ e.stopPropagation(); deletePromptPath(btn.dataset.treeDirDelete, true); });
  });
  host.querySelectorAll("[data-tree-file]").forEach(el=>{
    el.addEventListener("click", ()=> openPromptFile(el.dataset.treeFile, el.dataset.missing==="1"));
  });
}

function renderTreeNode(node, depth){
  const pad = 8 + depth*14;
  if(node.is_dir){
    const open = state.treeOpen[node.path] !== false; // default open
    const kids = (node.children||[]).map(c=>renderTreeNode(c, depth+1)).join("");
    const activeDir = state.promptDir===node.path;
    return `<div class="tree-node">
      <div class="tree-row${activeDir?" active":""}" data-tree-toggle="${attr(node.path)}" style="padding-left:${pad}px">
        <span class="tree-twist${open?" open":""}">▶</span>
        <span class="tree-ico">${open?"📂":"📁"}</span>
        <span class="tree-label">${esc(node.name)}</span>
        <button class="chip-x" type="button" data-tree-dir-delete="${attr(node.path)}" title="빈 폴더 삭제">×</button>
      </div>
      <div class="tree-children" style="display:${open?"block":"none"}">${kids}</div>
    </div>`;
  }
  const active = state.promptPath===node.path && !node.missing;
  const dirty = active && state.promptDirty;
  const cls = `tree-row${active?" active":""}${node.missing?" missing":""}`;
  const ico = node.missing ? "○" : iconForKind(node.kind, node.name);
  const inherit = node.missing && node.inherited_source && node.inherited_source!=="none" ? `← ${node.inherited_source}` : "";
  const tag = node.scene_key ? `scene:${node.scene_key}` : (node.kind && node.kind!=="md" ? node.kind : "");
  return `<div class="tree-node">
    <div class="${cls}" data-tree-file="${attr(node.path)}" data-missing="${node.missing?1:0}" style="padding-left:${pad+14}px" title="${attr(node.path)}">
      <span class="tree-ico">${ico}</span>
      <span class="tree-label">${esc(node.name)}${node.missing?" (없음)":""}</span>
      ${dirty?'<span class="tree-dirty" title="저장 안 됨"></span>':""}
      ${inherit?`<span class="tree-tag">${esc(inherit)}</span>`:""}
      ${tag?`<span class="tree-tag">${esc(tag)}</span>`:""}
    </div>
  </div>`;
}
function iconForKind(kind, name){
  const n=(name||"").toLowerCase();
  if(n.startsWith("opening_scene")) return "🎬";
  if(n.includes("few_shot")||kind==="few_shot") return "🎯";
  if(kind==="scene"||/scenes?/.test(n)) return "🎭";
  if(n.startsWith("world")) return "🌐";
  if(n.startsWith("prose")) return "✍️";
  if(n.includes("cot_append")||kind==="cot") return "🚫";
  if(n.startsWith("scenario")) return "📑";
  return "📄";
}

function findPromptNode(nodes, path){
  for(const n of (nodes||[])){
    if(n.path===path && !n.is_dir) return n;
    if(n.is_dir && n.children){ const f=findPromptNode(n.children, path); if(f) return f; }
  }
  return null;
}

async function openPromptFile(path, missing){
  if(state.promptDirty && path!==state.promptPath){
    if(!confirm("저장하지 않은 변경사항이 있습니다. 다른 파일을 여시겠습니까?")) return;
  }
  state.promptPath = path;
  state.promptDirty = false;
  // loading editor state
  state.promptMeta = null;
  renderTree();
  renderPromptEditor(true);
  try{
    const meta = await apiGet(`/api/worlds/${encodeURIComponent(state.worldId)}/prompt${qp({ path })}`);
    state.promptMeta = meta;
    state.promptBaseline = meta.content || "";
    renderPromptEditor();
  }catch(err){
    if(missing){
      state.promptMeta = { path, content:"", kind:"missing", checks:[], _missing:true };
      state.promptBaseline = "";
    }else{
      state.promptMeta = { path, content:"", kind:"error", checks:[], _error: err.message };
    }
    renderPromptEditor();
    if(!missing) toast("파일 로드 실패: "+err.message, "e");
  }
}

function renderPromptEditor(loading){
  const host = $("editor-panel");
  if(!host) return;
  if(!state.promptPath){
    host.innerHTML = `<div class="editor-placeholder"><div class="state-box">
      <div class="state-icon">📄</div>
      <div class="state-text">왼쪽 트리에서 파일을 선택하세요</div>
      <div class="state-sub">Markdown 편집 + 실시간 미리보기. <code class="mono">scenes/{key}.md</code>, <code class="mono">few_shot/{key}.md</code> 는 씬 타입 키와 1:1 매칭됩니다.</div>
    </div></div>`;
    return;
  }
  const meta = state.promptMeta;
  const kind = meta?.kind || "md";
  const isMissing = meta?._missing;
  const isError = meta?._error;

  // banners (checks + special hints)
  let banners = "";
  const name = state.promptPath.split("/").pop().toLowerCase();
  if(isMissing){
    const inheritedSource = meta?.inherited_source;
    const inheritedPath = meta?.inherited_path;
    if(inheritedSource && inheritedSource!=="none"){
      banners += `<div class="banner banner-info"><span class="banner-icon">↳</span>
        <div>이 파일은 아직 시나리오 override가 없어서 <b>${esc(inheritedSource)}</b> 프롬프트를 상속 중입니다.${inheritedPath?` <code class="mono">${esc(inheritedPath)}</code>`:""} 저장하면 현재 경로에 override 파일이 생성됩니다.</div></div>`;
    }
    banners += `<div class="banner banner-warn"><span class="banner-icon">⚠</span>
      <div>이 파일은 아직 존재하지 않는 <b>가상 플레이스홀더</b>입니다. 내용을 입력하고 저장하면 생성됩니다. (SCENE_TYPES 키에 대응하는 파일이 없을 때 표시)</div></div>`;
  }
  if(isError){
    banners += `<div class="banner banner-er"><span class="banner-icon">⚠</span><div>${esc(isError)}</div></div>`;
  }
  if(name.startsWith("opening_scene")){
    banners += `<div class="banner banner-info"><span class="banner-icon">ℹ</span>
      <div>오프닝 내레이션 — <span class="hint-chip"><code>{char}</code> NPC 이름</span> &nbsp; <span class="hint-chip"><code>{user}</code> PC 이름</span> 이 치환됩니다.</div></div>`;
  }
  if(name.includes("few_shot") || kind==="few_shot"){
    banners += `<div class="banner banner-info"><span class="banner-icon">🎯</span>
      <div>few-shot 예시 — <code class="mono">## good</code> / <code class="mono">## bad</code> 두 섹션이 필요합니다. <span id="fewshot-check"></span></div></div>`;
  }
  if(meta?.checks?.length){
    const items = meta.checks.map(c=>`<li><b>${esc((c.level||"info").toUpperCase())}</b> — ${esc(c.message)}</li>`).join("");
    const hasWarn = meta.checks.some(c=>c.level==="warn");
    banners += `<div class="banner ${hasWarn?"banner-warn":"banner-info"}"><span class="banner-icon">${hasWarn?"⚠":"ℹ"}</span>
      <div><b>검사</b><ul>${items}</ul></div></div>`;
  }

  const dirtyMark = state.promptDirty ? `<span class="dirty-dot" title="저장되지 않은 변경"></span>` : "";
  const canDelete = state.promptPath && !isMissing && !isError;
  const canSave = state.promptDirty || isMissing;
  const saveLabel = isMissing ? "오버라이드 저장" : `${state.promptDirty?"● ":""}저장`;
  host.innerHTML = `
    <div class="editor-bar">
      <div class="editor-path">
        ${dirtyMark}
        <span style="overflow:hidden;text-overflow:ellipsis">${esc(state.promptPath)}</span>
        <span class="ep-kind">${esc(kind)}</span>
      </div>
      <div class="editor-actions">
        <button class="btn btn-sm" data-md-tool="bold" title="굵게">B</button>
        <button class="btn btn-sm" data-md-tool="italic" title="기울임"><i>I</i></button>
        <button class="btn btn-sm" data-md-tool="code" title="코드">⌘</button>
        <button class="btn btn-sm" data-md-tool="list" title="리스트">•</button>
        <button class="btn btn-sm" data-md-tool="quote" title="인용">❯</button>
        <button class="btn btn-sm" data-md-tool="var-char" title="{char}">{char}</button>
        <button class="btn btn-sm" data-md-tool="var-user" title="{user}">{user}</button>
        <button class="btn btn-sm" id="toggle-symbols" title="기호 삽입 (관계/조건/부정/포함)">∑ 기호</button>
        <button class="btn btn-sm" id="toggle-preview" title="미리보기 토글">👁 미리보기</button>
        ${canDelete?`<button class="btn btn-sm btn-cancel" id="prompt-delete" title="파일 삭제">🗑 삭제</button>`:""}
        <button class="save-btn" id="prompt-save" ${canSave?"":"disabled"}>${saveLabel}</button>
      </div>
    </div>
    <div id="md-symbol-row" style="display:none;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--bd)">
      ${mdSymBtns(MD_SYMBOLS_BASIC)}
      <button class="btn btn-sm" id="md-symbol-more" title="기호 더보기">더보기 …</button>
      <span id="md-symbol-extra" style="display:none;gap:4px;flex-wrap:wrap">${mdSymBtns(MD_SYMBOLS_MORE)}</span>
    </div>
    <div style="padding:0 16px;${banners?"padding-top:12px":""}">${banners}</div>
    <div class="editor-split" id="editor-split">
      <div class="monaco-wrap">
        <div id="monaco-host"></div>
        <textarea id="monaco-fallback" spellcheck="false"></textarea>
      </div>
      <div class="preview-wrap" id="preview-wrap">
        <div class="preview-head">미리보기</div>
        <div class="md-body" id="md-preview"></div>
      </div>
    </div>`;

  $("prompt-save").addEventListener("click", ()=>savePromptFile());
  document.querySelectorAll("[data-md-tool]").forEach(b=>b.addEventListener("click", ()=>applyMarkdownTool(b.dataset.mdTool)));
  document.querySelectorAll("[data-md-sym]").forEach(b=>b.addEventListener("click", ()=>replaceEditorSelection(b.dataset.mdSym, "", "")));
  const symToggle = $("toggle-symbols"), symRow = $("md-symbol-row");
  if(symToggle && symRow) symToggle.addEventListener("click", ()=>{ symRow.style.display = symRow.style.display==="none" ? "flex" : "none"; });
  const symMore = $("md-symbol-more"), symExtra = $("md-symbol-extra");
  if(symMore && symExtra) symMore.addEventListener("click", ()=>{ symExtra.style.display = symExtra.style.display==="none" ? "contents" : "none"; });
  const delBtn = $("prompt-delete");
  if(delBtn) delBtn.addEventListener("click", deletePromptFile);
  $("toggle-preview").addEventListener("click", ()=>{
    const split = $("editor-split");
    split.classList.toggle("no-preview");
    if(monacoEditor) setTimeout(()=>monacoEditor.layout(), 30);
  });

  const initial = isError ? "" : (state.promptBaseline||"");
  mountEditor(initial);
  updatePreview(initial);
}

/* ── Monaco mount / fallback ── */
function disposeMonaco(){
  if(monacoEditor){ try{ monacoEditor.dispose(); }catch(_){} monacoEditor=null; }
}
function mountEditor(value){
  const hostEl = $("monaco-host");
  const fallback = $("monaco-fallback");
  if(!hostEl) return;
  disposeMonaco();

  const useFallback = ()=>{
    hostEl.style.display="none";
      fallback.style.display="block";
    fallback.value = value;
    fallback.oninput = ()=>{ onEditorChange(fallback.value); };
    fallback.onblur  = ()=>{ if(state.promptDirty && state.promptPath) savePromptFile(true); };
    fallback.oncompositionstart = ()=>{ fallback.dataset.composing = "1"; };
    fallback.oncompositionend = ()=>{ fallback.dataset.composing = ""; onEditorChange(fallback.value); };
    fallback.onkeydown = handleFallbackMarkdownKeydown;
  };

  if(monacoFailed){ useFallback(); return; }
  if(!window.require){ monacoFailed=true; useFallback(); return; }

  const create = ()=>{
    try{
      fallback.style.display="none";
      hostEl.style.display="block";
      monacoEditor = monaco.editor.create(hostEl, {
        value, language:"markdown", theme:"vs-dark-graphrag",
        automaticLayout:true, wordWrap:"on", minimap:{enabled:false},
        fontSize:13, lineHeight:21, fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',
        scrollBeyondLastLine:false, padding:{top:12,bottom:12}, renderLineHighlight:"none",
        smoothScrolling:true, tabSize:2,
        autoClosingBrackets:"always", autoClosingQuotes:"always", autoSurround:"languageDefined",
      });
      monacoEditor.onDidChangeModelContent(()=>{ onEditorChange(monacoEditor.getValue()); });
      monacoEditor.onDidBlurEditorWidget(()=>{ if(state.promptDirty && state.promptPath) savePromptFile(true); });
      registerOpeningSceneCompletion();
    }catch(err){ monacoFailed=true; useFallback(); }
  };

  if(monacoReady && monaco){ create(); return; }
  try{
    require.config({ paths:{ vs:"https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs" } });
    require(["vs/editor/editor.main"], ()=>{
      monaco = window.monaco;
      monacoReady = true;
      try{
        monaco.editor.defineTheme("vs-dark-graphrag", {
          base:"vs-dark", inherit:true, rules:[],
          colors:{ "editor.background":"#070a0f", "editor.lineHighlightBackground":"#121a27",
            "editorLineNumber.foreground":"#33415c", "editor.selectionBackground":"#3b82f640",
            "editorCursor.foreground":"#3b82f6" }
        });
      }catch(_){}
      create();
    }, ()=>{ monacoFailed=true; useFallback(); });
  }catch(err){ monacoFailed=true; useFallback(); }
}
function getEditorValue(){
  if(monacoEditor) return monacoEditor.getValue();
  const fb = $("monaco-fallback"); return fb ? fb.value : "";
}

function replaceEditorSelection(before, after="", placeholder=""){
  if(monacoEditor){
    const sel = monacoEditor.getSelection();
    const model = monacoEditor.getModel();
    const picked = model.getValueInRange(sel) || placeholder;
    const text = before + picked + after;
    monacoEditor.executeEdits("toolbar", [{ range:sel, text, forceMoveMarkers:true }]);
    monacoEditor.focus();
    onEditorChange(monacoEditor.getValue());
    return;
  }
  const fb = $("monaco-fallback");
  if(!fb) return;
  const start = fb.selectionStart, end = fb.selectionEnd;
  const picked = fb.value.slice(start, end) || placeholder;
  const text = before + picked + after;
  fb.setRangeText(text, start, end, "select");
  fb.focus();
  onEditorChange(fb.value);
}

// AI가 관계/조건/부정/포함을 명확히 읽도록 돕는 기호 (장식 아님). 기본 노출 + 더보기 분리.
const MD_SYMBOLS_BASIC = [
  ["→","함의/이어짐: A → B (A면 B로 이어짐)"],["⇒","논리적 함의: A ⇒ B"],
  ["∧","그리고 (AND): A ∧ B"],["∨","또는 (OR): A ∨ B"],
  ["¬","부정 (NOT): ¬A"],["≠","같지 않음: A ≠ B"],
  ["⊆","포함 (부분집합): A ⊆ B"],["∈","원소: a ∈ B"],
];
const MD_SYMBOLS_MORE = [
  ["⇔","동치 (iff): A ⇔ B"],["∉","원소 아님: a ∉ B"],["∀","모든: ∀x"],["∃","존재: ∃x"],
  ["≥","이상 (≥)"],["≤","이하 (≤)"],["≈","근사 (≈)"],["↔","양방향 관계"],
  ["×","충돌/금지"],["✓","허용/참"],["✗","금지/거짓"],["…","생략/계속"],
];
function mdSymBtns(list){
  return list.map(([s,t])=>`<button class="btn btn-sm" data-md-sym="${attr(s)}" title="${attr(t)}">${esc(s)}</button>`).join("");
}

function applyMarkdownTool(tool){
  const map = {
    bold:["**","**","text"],
    italic:["*","*","text"],
    code:["`","`","code"],
    list:["- ","","item"],
    quote:["> ","","quote"],
    "var-char":["{char}","",""],
    "var-user":["{user}","",""],
  };
  const spec = map[tool];
  if(spec) replaceEditorSelection(spec[0], spec[1], spec[2]);
}

function handleFallbackMarkdownKeydown(e){
  if(e.isComposing || e.currentTarget?.dataset.composing==="1") return;
  const pairs = { "(":")", "[":"]", "{":"}", '"':'"', "'":"'", "`":"`" };
  if(pairs[e.key] && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault();
    replaceEditorSelection(e.key, pairs[e.key], "");
    return;
  }
  if(e.key==="Enter"){
    const ta = e.currentTarget;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const before = ta.value.slice(0, start);
    const line = before.split("\n").pop() || "";
    const m = line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(.*)$/);
    if(m){
      e.preventDefault();
      const markerText = m[1] + m[2] + m[3];
      if(m[4].trim()===""){
        const lineStart = before.length - line.length;
        ta.setSelectionRange(lineStart, start);
        ta.setRangeText("", lineStart, start, "end");
      }else{
        let nextMarker = m[2];
        const numbered = m[2].match(/^(\d+)([.)])$/);
        if(numbered) nextMarker = `${Number(numbered[1]) + 1}${numbered[2]}`;
        ta.setRangeText("\n"+m[1]+nextMarker+m[3], start, end, "end");
      }
      onEditorChange(ta.value);
    }
  }
}
function registerOpeningSceneCompletion(){
  const name = state.promptPath.split("/").pop().toLowerCase();
  if(!name.startsWith("opening_scene")) return;
  if(window.__openingSceneProvider) return; // register once
  window.__openingSceneProvider = monaco.languages.registerCompletionItemProvider("markdown", {
    triggerCharacters:["{"],
    provideCompletionItems(model, position){
      const word = model.getWordUntilPosition(position);
      const range = { startLineNumber:position.lineNumber, endLineNumber:position.lineNumber, startColumn:word.startColumn, endColumn:word.endColumn };
      return { suggestions:[
        { label:"{char}", kind:monaco.languages.CompletionItemKind.Variable, insertText:"{char}", detail:"NPC 한글 이름", range },
        { label:"{user}", kind:monaco.languages.CompletionItemKind.Variable, insertText:"{user}", detail:"PC 이름", range },
      ]};
    }
  });
}
function onEditorChange(value){
  const wasDirty = state.promptDirty;
  state.promptDirty = (value !== (state.promptBaseline||""));
  if(wasDirty !== state.promptDirty){
    const isMissing = state.promptMeta?._missing;
    const sv = $("prompt-save"); if(sv){ sv.disabled = !(state.promptDirty || isMissing); sv.innerHTML = isMissing ? "오버라이드 저장" : ((state.promptDirty?"● ":"")+"저장"); }
    const dm = document.querySelector(".editor-path .dirty-dot");
    const pathEl = document.querySelector(".editor-path");
    if(state.promptDirty && !dm && pathEl){ const s=document.createElement("span"); s.className="dirty-dot"; pathEl.prepend(s); }
    if(!state.promptDirty && dm) dm.remove();
    renderTree();
  }
  updatePreview(value);
  promptAutosave();   // 입력 3초 디바운스 자동저장
}
// 프롬프트 자동저장: 입력 멈춘 뒤 3초. dirty 일 때만.
const promptAutosave = debounce(()=>{ if(state.promptDirty && state.promptPath) savePromptFile(true); }, 3000);
const updatePreview = debounce(function(value){
  const host = $("md-preview");
  if(!host) return;
  if(window.marked){
    try{
      const html = window.marked.parse(value||"", { breaks:true, gfm:true });
      host.innerHTML = sanitizeBasic(html);
    }catch(_){ host.textContent = value||""; }
  } else {
    host.innerHTML = `<pre style="white-space:pre-wrap">${esc(value||"")}</pre>`;
  }
  // few_shot live check
  const checkEl = $("fewshot-check");
  if(checkEl){
    const v = (value||"").toLowerCase();
    const hasGood = /(^|\n)\s*#{1,3}\s*good\b/.test(v);
    const hasBad  = /(^|\n)\s*#{1,3}\s*bad\b/.test(v);
    if(hasGood && hasBad) checkEl.innerHTML = `<span style="color:var(--ok)">✓ good/bad 모두 존재</span>`;
    else checkEl.innerHTML = `<span style="color:var(--warn)">⚠ 누락: ${[!hasGood?"## good":"",!hasBad?"## bad":""].filter(Boolean).join(", ")}</span>`;
  }
}, 120);
function sanitizeBasic(html){
  // light sanitize: strip script/style/event handlers (preview only, content is author-trusted)
  return String(html)
    .replace(/<script[\s\S]*?<\/script>/gi,"")
    .replace(/<style[\s\S]*?<\/style>/gi,"")
    .replace(/ on\w+="[^"]*"/gi,"")
    .replace(/ on\w+='[^']*'/gi,"");
}

async function savePromptFile(quiet=false){
  if(!state.promptPath) return;
  const sv = $("prompt-save");
  const content = getEditorValue();
  if(sv && !quiet){ sv.disabled=true; sv.innerHTML="저장 중…"; }
  try{
    const res = await apiSend("PUT", `/api/worlds/${encodeURIComponent(state.worldId)}/prompt${qp({ path: state.promptPath })}`, { content });
    const ok = handleSaveResult(res, quiet);
    if(ok){
      state.promptBaseline = content;
      state.promptDirty = false;
      // a previously-missing file now exists: re-fetch tree so it loses the placeholder style
      if(state.promptMeta && (state.promptMeta._missing || state.promptMeta.kind==="missing")){
        state.promptMeta = { path: state.promptPath, content, kind:"md", checks:[] };
        if(!quiet) await refreshPromptsTree();
      }
      // 자동저장: 에디터 재렌더 없이(커서/스크롤 유지) dirty 표시만 정리.
      if(quiet){ const dm=document.querySelector(".editor-path .dirty-dot"); if(dm) dm.remove(); }
      else renderPromptEditor();
    }
  }catch(err){
    setStatus({ ok:false, message:err.message });
    toast("저장 실패: "+err.message, "e");
  }finally{
    if($("prompt-save")){ $("prompt-save").disabled = !state.promptDirty; $("prompt-save").innerHTML = (state.promptDirty?"● ":"")+"저장"; }
  }
}
function openPromptCreateModal(isDir){
  const baseDir = (state.promptDir || "").replace(/\/?$/, "");
  const defaultPath = baseDir
    ? `${baseDir}/${isDir ? "new_folder" : "new_file.md"}`
    : (isDir ? `scenarios/${curSid()}/scenes` : "scenes/new_scene.md");
  openModal({
    title:isDir?"새 프롬프트 폴더":"새 프롬프트 파일",
    icon:isDir?"📁":"📄",
    submitLabel:isDir?"폴더 생성":"파일 생성",
    bodyHtml:`<div class="field-grid">
      <div class="field">
        <label class="flabel">prompt/ 기준 경로</label>
        <input class="finput mono" id="np-path" value="${attr(defaultPath)}" placeholder="${isDir?"scenarios/"+curSid()+"/scenes":"scenes/new_scene.md"}" spellcheck="false">
        <div class="fhint">상대경로만 허용됩니다. 파일은 .md 확장자를 사용합니다.</div>
      </div>
      ${isDir?"":`<div class="field"><label class="flabel">초기 내용</label><textarea class="ftext mono" id="np-content" style="min-height:100px"></textarea></div>`}
    </div>`,
    async onSubmit(root){
      const path = root.querySelector("#np-path").value.trim().replaceAll("\\\\","/");
      const content = isDir ? "" : root.querySelector("#np-content").value;
      if(!path){ toast("경로를 입력하세요","e"); return false; }
      try{
        const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/prompt_path`, { path, is_dir:isDir, content });
        const ok = handleSaveResult(res);
        if(ok){
          await refreshPromptsTree();
          if(!isDir) await openPromptFile(path, false);
          return true;
        }
        return false;
      }catch(err){ setStatus({ok:false,message:err.message}); toast("생성 실패: "+err.message,"e"); return false; }
    },
  });
}

async function deletePromptFile(){
  if(!state.promptPath) return;
  await deletePromptPath(state.promptPath, false);
}

async function deletePromptPath(path, isDir){
  if(!path) return;
  if(!confirm(`${isDir?"프롬프트 폴더를 삭제할까요? 폴더는 비어 있어야 합니다.":"프롬프트 파일을 삭제할까요?"}\n${path}`)) return;
  try{
    const res = await apiSend("DELETE", `/api/worlds/${encodeURIComponent(state.worldId)}/prompt_path${qp({ path })}`);
    const ok = handleSaveResult(res);
    if(ok){
      if(state.promptPath===path || !isDir && state.promptPath===path){
        state.promptPath = "";
        state.promptMeta = null;
        state.promptBaseline = "";
        state.promptDirty = false;
      }
      if(state.promptDir===path) state.promptDir = "";
      await refreshPromptsTree();
      renderPromptEditor();
    }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("삭제 실패: "+err.message,"e"); }
}

async function refreshPromptsTree(){
  const key = cacheKey();
  const scn = state.scenarioId;
  try{
    const p = await apiGet(`/api/worlds/${encodeURIComponent(state.worldId)}/prompts${qp({ scenario: scn })}`);
    state.cache[key] = state.cache[key]||{};
    state.cache[key].prompts = p;
    renderNav();
    renderTree();
  }catch(_){}
}

}

function wireTupleCard(kind, row, i){
  const card = sectionPane.querySelector(`.card[data-row="${i}"]`);
  if(!card) return;
  // tag/link chips: remove + add
  card.querySelectorAll("[data-chips]").forEach(box=>{
    box.querySelectorAll("[data-rm-tag]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ btn.closest(".chip").remove(); });
    });
    const addBtn = box.querySelector("[data-add-tag]");
    if(addBtn){
      addBtn.addEventListener("click", ()=>{
        const v = prompt("추가할 값:");
        if(v===null) return; const t=v.trim(); if(!t) return;
        const cls = box.dataset.chips==="tags" ? "chip-tag" : (box.dataset.chips==="scenarios" ? "chip-scn" : "chip-link");
        const span = document.createElement("span");
        span.className = `chip ${cls}`;
        span.innerHTML = `${esc(t)}<button class="chip-x" type="button" data-rm-tag>×</button>`;
        span.querySelector("[data-rm-tag]").addEventListener("click",()=>span.remove());
        box.insertBefore(span, addBtn);
      });
    }
  });
  const saveBtn = card.querySelector("[data-save]");
  if(saveBtn){ saveBtn.addEventListener("click", ()=> saveTupleRow(kind, row, card, saveBtn));
    attachAutosave(card, ()=>saveTupleRow(kind, row, card, saveBtn, true), ()=>card.isConnected); }
  const delBtn = card.querySelector("[data-delete]");
  if(delBtn) delBtn.addEventListener("click", ()=> deleteTupleRow(kind, row, delBtn));
}

async function deleteTupleRow(kind, row, btn){
  const isLoc = kind==="location";
  const label = isLoc ? "장소" : "규칙";
  if(!confirm(`'${row.name||row.id}' ${label}을(를) 삭제할까요? 되돌릴 수 없습니다.`)) return;
  const base = `/api/worlds/${encodeURIComponent(state.worldId)}/${isLoc?"locations":"rules"}/${encodeURIComponent(row.id)}`;
  btn.disabled=true; const orig=btn.textContent; btn.textContent="삭제 중…";
  try{
    const res = await apiSend("DELETE", base);
    const ok = handleSaveResult(res);
    if(ok) await refreshGraphOnly().then(()=> renderSection());
  }catch(err){
    setStatus({ ok:false, message:err.message });
    toast("삭제 실패: "+err.message, "e");
  }finally{ if(btn.isConnected){ btn.disabled=false; btn.textContent=orig; } }
}

function collectChips(card, name){
  const box = card.querySelector(`[data-chips="${name}"]`);
  if(!box) return null;
  return [...box.querySelectorAll(".chip")].map(c=>{
    // chip text = node minus the × button
    const clone = c.cloneNode(true); const x = clone.querySelector(".chip-x"); if(x) x.remove();
    return clone.textContent.trim();
  }).filter(Boolean);
}

async function saveTupleRow(kind, row, card, btn, quiet=false){
  const values = {};
  card.querySelectorAll("[data-f]").forEach(el=>{
    const k = el.dataset.f;
    if(el.type==="number"){ const n=Number(el.value); values[k]=Number.isFinite(n)?n:el.value; }
    else values[k] = el.value;
  });
  const tags = collectChips(card, "tags"); if(tags) values.tags = tags;
  const scns = collectChips(card, "scenarios"); if(scns) values.scenarios = scns;
  if(kind==="location"){ const links = collectChips(card, "part_of"); if(links){ values.part_of = links; values.links = links; } }

  btn.disabled=true; const orig=btn.textContent; btn.textContent="저장 중…";
  try{
    const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/tuple_row`, {
      kind, row_id: row.id, values,
    });
    const ok = handleSaveResult(res, quiet);
    if(ok){ await refreshGraphOnly(); if(!quiet) renderSection(); }   // 저장 후 섹션 재렌더(자동저장은 생략)
  }catch(err){
    setStatus({ ok:false, message:err.message });
    toast("저장 실패: "+err.message, "e");
  }finally{ btn.disabled=false; btn.textContent=orig; }
}

function rosterCacheKey(){ return `${state.worldId}::${curSid()}`; }

async function ensureScenarioRoster(){
  const key = rosterCacheKey();
  if(state.rosterKey===key && state.scnCharIds!==null && state.allCharacters.length) return;
  const wid = encodeURIComponent(state.worldId);
  const sid = encodeURIComponent(curSid());
  const [all, scn] = await Promise.all([
    apiGet(`/api/worlds/${wid}/all_characters`),
    apiGet(`/api/worlds/${wid}/scenarios/${sid}/characters`),
  ]);
  state.allCharacters = all.characters || [];
  state.scnCharIds = scn.char_ids || [];
  state.rosterKey = key;
  state.rosterDirty = false;
}

function renderScenarioRoster(){
  const host = $("scenario-roster");
  if(!host) return;
  if(state.scnCharIds===null || state.rosterKey!==rosterCacheKey()){
    host.innerHTML = `<div class="char-roster"><div class="state-box" style="padding:28px"><div class="spinner"></div><div class="state-text">등장인물 로딩…</div></div></div>`;
    ensureScenarioRoster().then(renderCharacters).catch(err=>{
      host.innerHTML = `<div class="char-roster"><div class="scn-roster-empty">등장인물 로드 실패<br>${esc(err.message)}</div></div>`;
    });
    return;
  }
  const selected = new Set(state.scnCharIds || []);
  const byId = new Map(state.allCharacters.map(c=>[c.char_id, c]));
  const active = (state.scnCharIds || []).map(id=>byId.get(id)).filter(Boolean);
  const inactive = state.allCharacters.filter(c=>!selected.has(c.char_id));
  const item = (c, inScenario)=>`<div class="roster-item" draggable="true" data-roster-id="${attr(c.char_id)}">
    <span class="ri-name">${esc(c.name||c.char_id)}</span>
    <span class="ri-id">${esc(c.char_id)}</span>
    <button class="roster-move" type="button" data-roster-move="${attr(c.char_id)}" data-to="${inScenario?"out":"in"}">${inScenario?"−":"+"}</button>
  </div>`;
  host.innerHTML = `<div class="char-roster">
    <div class="char-roster-head">
      <div class="char-roster-title">시나리오 등장인물</div>
      <div class="char-roster-sub"><span class="mono">${esc(curSid())}</span> 의 chars 리스트를 편집합니다.</div>
    </div>
    <div class="roster-columns">
      <div class="roster-box">
        <div class="roster-box-head">등장 (${active.length})</div>
        <div class="roster-list" data-roster-list="in">${active.map(c=>item(c,true)).join("") || `<div class="scn-roster-empty">비어 있음</div>`}</div>
      </div>
      <div class="roster-box">
        <div class="roster-box-head">미등장 (${inactive.length})</div>
        <div class="roster-list" data-roster-list="out">${inactive.map(c=>item(c,false)).join("") || `<div class="scn-roster-empty">비어 있음</div>`}</div>
      </div>
    </div>
    <div class="char-roster-foot">
      <button class="btn btn-sm" id="roster-reset" ${state.rosterDirty?"":"disabled"}>되돌리기</button>
      <button class="save-btn" id="roster-save" ${state.rosterDirty?"":"disabled"}>저장</button>
    </div>
  </div>`;
  wireScenarioRoster();
}

function moveRosterChar(charId, toScenario){
  const ids = new Set(state.scnCharIds || []);
  if(toScenario) ids.add(charId); else ids.delete(charId);
  state.scnCharIds = state.allCharacters.map(c=>c.char_id).filter(id=>ids.has(id));
  state.rosterDirty = true;
  renderScenarioRoster();
  rosterAutosave();
}

function wireScenarioRoster(){
  const host = $("scenario-roster");
  host.querySelectorAll("[data-roster-move]").forEach(btn=>{
    btn.addEventListener("click", e=>{
      e.stopPropagation();
      moveRosterChar(btn.dataset.rosterMove, btn.dataset.to==="in");
    });
  });
  host.querySelectorAll("[data-roster-id]").forEach(item=>{
    item.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/plain", item.dataset.rosterId); });
  });
  host.querySelectorAll("[data-roster-list]").forEach(list=>{
    list.addEventListener("dragover", e=>{ e.preventDefault(); list.classList.add("drop"); });
    list.addEventListener("dragleave", ()=>list.classList.remove("drop"));
    list.addEventListener("drop", e=>{
      e.preventDefault(); list.classList.remove("drop");
      const id = e.dataTransfer.getData("text/plain");
      if(id) moveRosterChar(id, list.dataset.rosterList==="in");
    });
  });
  $("roster-reset")?.addEventListener("click", async()=>{
    state.rosterKey = "";
    state.scnCharIds = null;
    await ensureScenarioRoster();
    renderScenarioRoster();
  });
  $("roster-save")?.addEventListener("click", ()=>saveScenarioRoster());
}

const rosterAutosave = debounce(()=>{ if(state.rosterDirty) saveScenarioRoster(true); }, 3000);

async function saveScenarioRoster(quiet=false){
  const btn = $("roster-save");
  if(btn && !quiet){ btn.disabled = true; btn.textContent = "저장 중…"; }
  try{
    const res = await apiSend("PUT", `/api/worlds/${encodeURIComponent(state.worldId)}/scenarios/${encodeURIComponent(curSid())}/characters`, {
      char_ids: state.scnCharIds || [],
    });
    const ok = handleSaveResult(res, quiet);
    if(ok){
      state.rosterDirty = false;
      await refreshGraphOnly();
      if(!quiet) renderCharacters();
    }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("등장인물 저장 실패: "+err.message,"e"); }
  finally{ if(btn){ btn.disabled=false; btn.textContent= state.rosterDirty?"● 저장":"저장"; } }
}

        <div class="alias-edit" style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span class="flabel" style="margin:0">별칭</span>
          <input class="finput" id="alias-input" value="${attr(aliasStr)}" placeholder="별칭 (쉼표로 구분)" style="max-width:360px;flex:0 1 360px">
          <button class="btn btn-sm" id="alias-save" type="button">별칭 저장</button>
        </div>
      </div>
    </div>
    ${tabBar}
    <div id="blob-body"></div>
  </div>
  <div id="char-cfg-card"></div>
  <div id="char-extras"></div>`;

  host.querySelectorAll("[data-blob]").forEach(b=>{
    b.addEventListener("click", ()=>{ state.blobTab=b.dataset.blob; renderBlobBody(ch); });
  });
  renderBlobBody(ch);
  renderCharCfg(ch);
  renderCharExtras(ch);
  const aliasSave = $("alias-save");
  if(aliasSave){ aliasSave.addEventListener("click", ()=> saveAliases(ch, aliasSave));
    attachAutosave($("alias-input"), ()=>saveAliases(ch, aliasSave, true), ()=>$("alias-input")?.isConnected); }
}

async function saveAliases(ch, btn, quiet=false){
  const inp = $("alias-input");
  if(!inp) return;
  // 쉼표 분리 → 전체 교체(삭제 포함). 백엔드가 중복/빈값 정리.
  const aliases = inp.value.split(",").map(s=>s.trim()).filter(Boolean);
  const orig = btn.textContent; btn.disabled = true; btn.textContent = "저장 중…";
  try{
    const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(ch.id)}/aliases`, { aliases });
    const ok = handleSaveResult(res, quiet);
    if(ok){ await refreshGraphOnly(); if(!quiet){ const g=curGraph(); const c=g?.characters?.find(x=>x.id===ch.id); if(c) renderCharCard(c); else renderCharacters(); } }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("저장 실패: "+err.message, "e"); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = orig; } }
}

const CFG_BASE_TAB = "__base__";  // blob 시나리오 탭에서 '기본값(DEFAULT_CFG)'을 가리키는 sentinel

function renderBlobBody(ch){
  // re-highlight active tab
  document.querySelectorAll("[data-blob]").forEach(b=>b.classList.toggle("active", b.dataset.blob===state.blobTab));
  const body = $("blob-body");
  const tab = getBlobTabs().find(t=>t.id===state.blobTab) || getBlobTabs()[0];
  if(!tab){ body.innerHTML=`<div class="state-sub">탭을 찾지 못했습니다.</div>`; return; }
  const role = tab.role;
  // cfg 패턴 캐릭터: tier 탭 아래에 시나리오 탭(기본값 + 월드 시나리오)을 두고 해당 cfg 섹션을 편집.
  // 커스텀 슬롯은 cfg 패턴 미지원 — 항상 직접 편집 모드.
  const isCfg = !tab.custom && !!(ch.cfg && Object.keys(ch.cfg.default||{}).length);
  const editInfo = (ch.edit&&ch.edit[role]) || { editable:true };

  let scnTabsHtml = "", isOverride = false;
  const defaultTier = isCfg ? ((ch.cfg.default||{})[role] || {}) : {};
  if(isCfg){
    // 기본값(__base__ = DEFAULT_CFG) + 시나리오별 탭(각 SCENARIO_OVERRIDES[sid]). default 시나리오도 표시명으로 노출.
    const scnList = [{id:CFG_BASE_TAB, label:"기본값"}].concat(
      (state.scenarios||[]).map(s=>({id:s.scenario_id||"default", label:s.display_name||s.scenario_id||"default"})));
    if(!scnList.some(s=>s.id===state.blobScenario)) state.blobScenario = CFG_BASE_TAB;
    isOverride = state.blobScenario!==CFG_BASE_TAB;
    scnTabsHtml = `<div class="tab-bar2" style="margin-bottom:12px">${scnList.map(s=>
      `<button class="tab-btn2${state.blobScenario===s.id?" active":""}" type="button" data-blob-scn="${attr(s.id)}">${esc(s.label)}</button>`).join("")}</div>`;
  }
  const editable = isCfg ? true : (editInfo.editable!==false);
  // 편집 대상: cfg면 (기본값 tier | 시나리오 override tier), 아니면 컴파일된 blob/state.
  const data = !isCfg ? ((role==="state" ? ch.state : ch[role]) || {})
             : (isOverride ? (((ch.cfg.all_overrides||{})[state.blobScenario]||{})[role] || {}) : defaultTier);

  // 자동저장 컨트롤러: 이 렌더의 탭/캐릭터 컨텍스트에 고정. 컨텍스트가 바뀐 뒤 디바운스가
  // 늦게 발화하면 스킵해 다른 탭 DOM을 잘못 저장하는 사고를 막는다.
  const _asTab=state.blobTab, _asScn=state.blobScenario, _asChar=ch.id;
  const autosave = makeAutosave(()=>{
    if(state.charId!==_asChar || state.blobTab!==_asTab || state.blobScenario!==_asScn) return;
    saveBlob(ch, role, data, $("blob-save"), true);
  });

  const std = STD_KEYS[role] || [];
  const baseKeys = isOverride ? Object.keys(defaultTier) : [];          // override 시 기본값 키도 노출(상속)
  const dataKeys = Object.keys(data);
  let orderedKeys = [...new Set([
    ...std,
    ...baseKeys.filter(k=>!std.includes(k)),
    ...dataKeys.filter(k=>!std.includes(k)),
  ])];

  // field type 셀렉터 (커스텀 슬롯 탭은 섹션 매핑이 없으므로 생략)
  const ftOverrides = tab.custom ? null : ((state.fieldTypes||{})[role] || {});
  const ftSelHtml = (k)=>{
    if(!ftOverrides) return "";
    const override = ftOverrides[k] || "";
    const defType  = ftEffectiveDefault(role, k);
    const isSet    = !!override;
    return `<select class="ft-sel${isSet?" ft-set":""}" data-ft-k="${attr(k)}" data-ft-sec="${attr(role)}" title="필드 분류">
      <option value=""${!isSet?" selected":""}>(기본 · ${defType})</option>
      <option value="appearance"${override==="appearance"?" selected":""}>appearance — 외형</option>
      <option value="personality"${override==="personality"?" selected":""}>personality — 성격</option>
      <option value="other"${override==="other"?" selected":""}>other — 공통</option>
    </select>`;
  };

  const rowHtml = (k)=>{
    const has = k in data;
    const v = has ? data[k] : "";
    const inherited = (isOverride && !has) ? defaultTier[k] : undefined;  // 비워둔 override → 기본값 상속(placeholder)
    const isCustom = isOverride ? !(k in defaultTier) : !std.includes(k);
    const ph = inherited!==undefined ? ` placeholder="${attr(fmtVal(inherited))}"` : "";
    let valEl = "";
    if(k==="gender"){
      const genderValue = String(v || "");
      const inheritedText = inherited!==undefined ? fmtVal(inherited) : "";
      const normalized = genderValue.toLowerCase();
      const selectValue = normalized==="male" || normalized==="female" ? normalized : "custom";
      const customValue = selectValue==="custom" ? genderValue : "";
      valEl = `<div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
        <select class="fselect gender-select" data-k="${attr(k)}" ${editable?"":"disabled"} style="flex:0 0 150px">
          <option value="female"${selectValue==="female"?" selected":""}>female</option>
          <option value="male"${selectValue==="male"?" selected":""}>male</option>
          <option value="custom"${selectValue==="custom"?" selected":""}>custom</option>
        </select>
        <textarea class="ftext kv-autogrow gender-custom" rows="1" data-k-custom="${attr(k)}" ${editable && selectValue==="custom"?"":"disabled"} placeholder="${attr(inheritedText || "custom gender")}">${esc(customValue)}</textarea>
      </div>`;
    } else {
      valEl = `<textarea class="ftext kv-autogrow" rows="1" data-k="${attr(k)}" ${editable?"":"disabled"}${ph}>${esc(fmtValMulti(v))}</textarea>`;
    }
    return `<div class="kv-edit${isCustom?" custom":""}${inherited!==undefined?" inherited":""}" data-keyrow="${attr(k)}">
      <div class="kv-edit-key"${keyHelp(k)?` title="${attr(keyHelp(k))}"`:""}>${esc(k)}${keyInfo(k)}${isCustom?`<span class="kv-custom-badge">CUSTOM</span>`:""}${ftSelHtml(k)}</div>
      <div class="kv-edit-val">${valEl}</div>
      <button class="kv-del" type="button" data-del-key="${attr(k)}" ${editable?"":"disabled"} title="키 삭제">🗑</button>
    </div>`;
  };
  let rows = orderedKeys.map(rowHtml).join("");
  if(!rows) rows = `<div class="state-box" style="padding:24px"><div class="state-text">키가 없습니다. 아래에서 추가하세요.</div></div>`;

  const banner = (!isCfg && !editable)
    ? `<div class="banner banner-warn" style="margin-bottom:14px"><span class="banner-icon">🔒</span><div>읽기 전용: ${esc(koReason(editInfo.reason))}</div></div>`
    : "";

  body.innerHTML = `
    ${scnTabsHtml}
    ${banner}
    <div class="flabel" style="margin-bottom:10px">${esc(tab.sub)}</div>
    <div class="kv-list">${rows}</div>
    ${editable?`<div class="addkey-row">
      <input class="finput" id="newkey-input" placeholder="새 키 이름 (예: favorite_food)">
      <button class="btn btn-v" id="add-key-btn" type="button">+ 키 추가</button>
    </div>`:""}
    ${editable?`<div style="margin-top:18px;display:flex;justify-content:flex-end">
      <button class="save-btn" id="blob-save">${esc(isCfg?(isOverride?"시나리오 override 저장":"기본값 저장"):tab.label+" 저장")}</button>
    </div>`:""}`;

  body.querySelectorAll("[data-blob-scn]").forEach(b=>b.addEventListener("click", ()=>{ state.blobScenario=b.dataset.blobScn; renderBlobBody(ch); }));

  // auto-grow textareas
  body.querySelectorAll("textarea.ftext").forEach(ta=>{
    ta.style.overflow = "hidden";
    const grow=()=>{ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; };
    grow(); ta.addEventListener("input",grow);
  });
  body.querySelectorAll(".gender-select").forEach(sel=>{
    sel.addEventListener("change", ()=>{
      const custom = sel.closest("[data-keyrow]")?.querySelector("[data-k-custom]");
      if(!custom) return;
      custom.disabled = sel.value !== "custom";
      if(sel.value === "custom"){
        custom.focus();
      }
      autosave.force();
    });
  });
  // delete key
  body.querySelectorAll("[data-del-key]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = btn.dataset.delKey;
      if(std.includes(k)){
        if(!confirm(`'${k}' 은 표준 키입니다. 삭제하면 다른 쿼리에서 참조될 수 있습니다. 계속할까요?`)) return;
      } else {
        if(!confirm(`'${k}' 키를 삭제할까요?`)) return;
      }
      btn.closest("[data-keyrow]").remove();
      autosave.force();   // 키 삭제 즉시 반영
    });
  });
  // add key
  const addBtn = $("add-key-btn");
  if(addBtn){
    const doAdd = ()=>{
      const inp = $("newkey-input");
      const k = inp.value.trim();
      if(!k){ inp.focus(); return; }
      if(body.querySelector(`[data-keyrow="${CSS.escape(k)}"]`)){ toast("이미 존재하는 키입니다","e"); return; }
      const list = body.querySelector(".kv-list");
      const sb = list.querySelector(".state-box"); if(sb) sb.remove();
      const div = document.createElement("div");
      div.innerHTML = rowHtml(k);
      const node = div.firstElementChild;
      list.appendChild(node);
      node.querySelector("[data-del-key]").addEventListener("click",()=>{ if(confirm(`'${k}' 키를 삭제할까요?`)){ node.remove(); autosave.force(); } });
      node.querySelector(".ft-sel")?.addEventListener("change", async e=>{ await setFieldType(e.target.dataset.ftSec, e.target.dataset.ftK, e.target.value); e.target.classList.toggle("ft-set", !!e.target.value); });
      node.querySelector(".finput,.ftext")?.focus();
      inp.value="";
    };
    addBtn.addEventListener("click", doAdd);
    $("newkey-input").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); doAdd(); } });
  }
  // field type 드롭다운 — 변경 즉시 API 저장, DOM 클래스 업데이트
  body.querySelectorAll(".ft-sel").forEach(sel=>{
    sel.addEventListener("change", async ()=>{
      await setFieldType(sel.dataset.ftSec, sel.dataset.ftK, sel.value);
      sel.classList.toggle("ft-set", !!sel.value);
    });
  });
  const saveBtn = $("blob-save");
  if(saveBtn) saveBtn.addEventListener("click", ()=> saveBlob(ch, role, data, saveBtn));
  if(editable) wireAutosave(body.querySelector(".kv-list"), autosave);
}

async function saveBlob(ch, role, originalData, btn, quiet=false){
  const body = $("blob-body");
  if(!body) return;
  const isCustomSlot = !!(state.extraSlots||[]).find(s=>s.id===role);
  const isCfg = !isCustomSlot && !!(ch.cfg && Object.keys(ch.cfg.default||{}).length);
  const sid = isCfg ? state.blobScenario : null;
  const isOverride = isCfg && sid!==CFG_BASE_TAB;
  const props = {};
  body.querySelectorAll("[data-keyrow]").forEach(rowEl=>{
    const el = rowEl.querySelector("[data-k]");
    if(!el) return;
    const k = el.dataset.k;
    let rawValue = el.value;
    if(k==="gender" && el.value==="custom"){
      rawValue = rowEl.querySelector("[data-k-custom]")?.value || "";
    }
    // override 모드는 빈 칸 = 기본값 상속이므로 저장에서 제외.
    if(isOverride && String(rawValue).trim()==="") return;
    props[k] = coerceValue(rawValue, originalData[k]);
  });
  btn.disabled=true; const orig=btn.textContent; btn.textContent="저장 중…";
  try{
    let res;
    if(isCfg && isOverride){
      // SCENARIO_OVERRIDES[sid][role] 만 교체(섹션이 비면 제거 → 전부 상속).
      const cur = { ...((ch.cfg.all_overrides||{})[sid] || {}) };
      if(Object.keys(props).length) cur[role] = props; else delete cur[role];
      res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(ch.id)}/cfg`, { scope:"override", scenario_id: sid, values: cur });
    } else if(isCfg){
      // DEFAULT_CFG[role] 만 교체(나머지 섹션 보존).
      const values = { ...(ch.cfg.default||{}), [role]: props };
      res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(ch.id)}/cfg`, { scope:"default", scenario_id: curSid(), values });
    } else if(role==="state"){
      res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/state`, { char_id: ch.id, fields: props, scenario_id: curSid() });
    } else {
      res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/blob`, { char_id: ch.id, role, props });
    }
    const ok = handleSaveResult(res, quiet);
    if(ok){
      await refreshGraphOnly();
      const g=curGraph(); const c=g?.characters?.find(x=>x.id===ch.id);
      if(quiet){
        // 자동저장: 카드 재렌더 없이 ch 데이터만 최신화(편집 중 포커스/스크롤 방해 X)
        if(c) Object.assign(ch, c);
      } else if(c){ renderCharCard(c); } else { renderCharacters(); }
    }
  }catch(err){
    setStatus({ ok:false, message:err.message });
    toast("저장 실패: "+err.message, "e");
  }finally{ if(btn){ btn.disabled=false; btn.textContent=orig; } }
}

function renderCharCfg(ch){
  const host = $("char-cfg-card");
  if(!host) return;
  const cfg = ch.cfg || { scenario_id:curSid(), default:{}, override:{}, effective:{}, editable:{} };
  // cfg 패턴 캐릭터는 위 blob 에디터(tier 탭 + 시나리오 탭)가 편집을 담당하므로 별도 카드 생략.
  if(Object.keys(cfg.default||{}).length){ host.innerHTML = ""; return; }
  const tiers = getBlobTabs().map(t=>({ id:t.id, label:t.label }));
  const tabs = [
    { id:"default", label:"기본값 DEFAULT_CFG", data:cfg.default||{}, save:true, sub:"모든 시나리오가 상속하는 기본 config" },
    { id:"override", label:`시나리오 Override`, data:cfg.override||{}, save:true, sub:`${cfg.scenario_id||curSid()} 에서만 덮어쓰는 delta` },
    { id:"effective", label:"병합 결과", data:cfg.effective||{}, save:false, sub:"DEFAULT_CFG 위에 현재 시나리오 override를 적용한 결과" },
  ];
  if(!tabs.some(t=>t.id===state.cfgTab)) state.cfgTab = "default";
  if(!tiers.some(t=>t.id===state.cfgTier)) state.cfgTier = "static";
  const active = tabs.find(t=>t.id===state.cfgTab) || tabs[0];
  const tier = tiers.find(t=>t.id===state.cfgTier) || tiers[0];
  const editInfo = (cfg.editable && cfg.editable[active.id]) || { editable:true };
  const editable = active.save && editInfo.editable!==false;
  const rootData = active.data || {};
  const tierData = rootData && typeof rootData[state.cfgTier] === "object" && !Array.isArray(rootData[state.cfgTier])
    ? rootData[state.cfgTier]
    : {};
  const inherited = active.id==="override" && Object.keys(tierData).length===0;
  const defaultTier = ((cfg.default||{})[state.cfgTier] || {});
  const effectiveTier = ((cfg.effective||{})[state.cfgTier] || {});
  // DEFAULT_CFG 가 비어 있으면 아직 손글씨(imperative) 캐릭터 → cfg 에디터가 무력하므로 변환을 권한다.
  const notMigrated = !Object.keys(cfg.default||{}).length;
  host.innerHTML = `<div class="card wide">
    <div class="card-head">
      <div class="card-head-main">
        <div class="card-title">시나리오별 캐릭터 설정</div>
        <div class="card-meta"><span class="mono">self.cfg</span> 는 런타임에 DEFAULT_CFG + SCENARIO_OVERRIDES[scenario] 로 병합됩니다.</div>
      </div>
    </div>
    ${notMigrated ? `<div class="banner banner-info" style="margin-bottom:14px"><span class="banner-icon">⚙</span><div>
      이 캐릭터는 아직 <span class="mono">DEFAULT_CFG</span> 가 없는 손글씨(imperative) 형태라 위 편집은 효과가 없습니다.
      cfg 패턴으로 변환하면 시나리오별 override 편집이 실제로 반영됩니다.
      <div style="margin-top:8px"><button class="btn" type="button" data-cfg-migrate>cfg 패턴으로 마이그레이션</button></div>
    </div></div>` : ""}
    <div class="tab-bar2">${tabs.map(t=>`<button class="tab-btn2${state.cfgTab===t.id?" active":""}" type="button" data-cfg-tab="${t.id}">${esc(t.label)}</button>`).join("")}</div>
    <div class="tab-bar2">${tiers.map(t=>`<button class="tab-btn2${state.cfgTier===t.id?" active":""}" type="button" data-cfg-tier="${t.id}">${esc(t.label)}</button>`).join("")}</div>
    ${!editable && active.save ? `<div class="banner banner-warn" style="margin-bottom:14px"><span class="banner-icon">🔒</span><div>읽기 전용: ${esc(koReason(editInfo.reason))}</div></div>` : ""}
    <div class="flabel" style="margin-bottom:10px">${esc(active.sub)} · ${esc(tier.label)}</div>
    ${inherited ? `<div class="banner banner-info" style="margin-bottom:12px"><span class="banner-icon">↳</span><div>이 tier는 override가 비어 있어 DEFAULT_CFG 값을 그대로 상속합니다.</div></div>` : ""}
    <textarea class="ftext mono" id="cfg-json" spellcheck="false" ${editable?"":"disabled"} style="min-height:180px">${esc(JSON.stringify(tierData, null, 2))}</textarea>
    ${active.id==="override" ? `<div class="field-2col" style="margin-top:12px">
      <div><div class="flabel" style="margin-bottom:6px">Inherited default</div><pre class="codebox">${esc(JSON.stringify(defaultTier, null, 2))}</pre></div>
      <div><div class="flabel" style="margin-bottom:6px">Effective result</div><pre class="codebox">${esc(JSON.stringify(effectiveTier, null, 2))}</pre></div>
    </div>` : ""}
    ${editable ? `<div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="save-btn" id="cfg-save">설정 저장</button></div>` : ""}
  </div>`;
  host.querySelectorAll("[data-cfg-tab]").forEach(b=>{
    b.addEventListener("click", ()=>{ state.cfgTab = b.dataset.cfgTab; renderCharCfg(ch); });
  });
  host.querySelectorAll("[data-cfg-tier]").forEach(b=>{
    b.addEventListener("click", ()=>{ state.cfgTier = b.dataset.cfgTier; renderCharCfg(ch); });
  });
  const saveBtn = $("cfg-save");
  if(saveBtn) saveBtn.addEventListener("click", ()=>saveCharCfg(ch, active.id, state.cfgTier, active.data || {}, saveBtn));
  const migBtn = host.querySelector("[data-cfg-migrate]");
  if(migBtn) migBtn.addEventListener("click", ()=>migrateCharFlow(ch));
}

async function migrateCharFlow(ch){
  // 1) 변환 가능성 분석 (디스크 무변경).
  let info;
  try{ info = await apiGet(`/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(ch.id)}/migrate-cfg`); }
  catch(err){ toast("분석 실패: "+err.message, "e"); return; }
  if(!info.migratable){ toast("자동 변환 불가: "+(info.message||""), "e"); return; }

  // 2) preview: 변환 소스를 만들고 모든 시나리오 재컴파일로 그래프 동일성을 검증한 diff 를 받는다.
  let pv;
  try{ pv = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(ch.id)}/migrate-cfg`, { apply:false }); }
  catch(err){ toast("미리보기 실패: "+err.message, "e"); return; }
  if(!pv.verified){ toast("검증 실패로 변환을 중단했습니다: "+(pv.message||""), "e"); return; }

  const ovr = Object.keys(info.scenario_overrides||{});
  // 3) diff 모달 — 적용 시 동일 그래프 보장됨을 명시.
  openModal({
    title:`cfg 변환: ${ch.id}`, icon:"⚙", submitLabel:"적용",
    bodyHtml:`<div class="banner banner-ok" style="margin-bottom:12px"><span class="banner-icon">✓</span><div>
        검증 통과 — 모든 시나리오를 재컴파일해 변환 전후 그래프가 동일함을 확인했습니다.</div></div>
      <div class="flabel" style="margin-bottom:6px">기본 cfg 섹션: <span class="mono">${esc(Object.keys(info.default_cfg||{}).join(", ")||"-")}</span>
        · override 시나리오: <span class="mono">${esc(ovr.join(", ")||"없음")}</span></div>
      <pre class="codebox" style="max-height:50vh;overflow:auto;white-space:pre">${esc(pv.diff||"(diff 없음)")}</pre>`,
    onSubmit: async ()=>{
      try{
        const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(ch.id)}/migrate-cfg`, { apply:true });
        if(!res.ok || !res.applied){ toast("적용 실패: "+(res.message||""), "e"); return false; }
        handleSaveResult(res);
        await refreshGraphOnly().then(()=>{
          const g=curGraph(); const c=g?.characters?.find(x=>x.id===ch.id);
          if(c) renderCharCard(c); else renderCharacters();
        });
        return true;
      }catch(err){ toast("적용 실패: "+err.message, "e"); return false; }
    },
  });
}

async function saveCharCfg(ch, scope, tier, rootData, btn){
  const ta = $("cfg-json");
  if(!ta) return;
  let tierValues;
  try{
    tierValues = JSON.parse(ta.value || "{}");
    if(!tierValues || typeof tierValues !== "object" || Array.isArray(tierValues)) throw new Error("object expected");
  }catch(err){
    toast("JSON 객체 형식이 아닙니다: "+err.message, "e");
    return;
  }
  const values = { ...(rootData || {}) };
  if(Object.keys(tierValues).length) values[tier] = tierValues;
  else delete values[tier];
  const orig = btn.textContent; btn.disabled = true; btn.textContent = "저장 중…";
  try{
    const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(ch.id)}/cfg`, {
      scope,
      scenario_id: curSid(),
      values,
    });
    const ok = handleSaveResult(res);
    if(ok) await refreshGraphOnly().then(()=>{
      const g=curGraph(); const c=g?.characters?.find(x=>x.id===ch.id);
      if(c) renderCharCard(c); else renderCharacters();
    });
  }catch(err){
    setStatus({ ok:false, message:err.message });
    toast("저장 실패: "+err.message, "e");
  }finally{ if(btn){ btn.disabled=false; btn.textContent=orig; } }
}

function renderCharExtras(ch){
  const host = $("char-extras");
  // items/goals/secrets: 항상 헤더+추가 버튼 노출(비어 있어도). schedules: 있을 때만.
  const addable = [
    { key:"items",   kind:"item",   title:"아이템 Items" },
    { key:"goals",   kind:"goal",   title:"목표 Goals" },
    { key:"secrets", kind:"secret", title:"비밀 Secrets" },
  ];
  let html = "";
  for(const sec of addable){
    const arr = ch[sec.key] || [];
    html += `<div class="subsec-title">${esc(sec.title)} <span class="subsec-count">${arr.length}</span>
      <button class="btn btn-sm" type="button" data-add-subnode="${attr(sec.kind)}" style="margin-left:8px">+ 추가</button></div>
      <div class="info-grid">${arr.length ? arr.map(item=>subnodeCard(item, {key:sec.key, editable:true}, ch.id)).join("") : `<div class="muted" style="font-size:12px;padding:4px 2px">없음</div>`}</div>`;
  }
  const sch = ch.schedules || [];
  html += `<div class="subsec-title">스케줄 Schedules <span class="subsec-count">${sch.length}</span>
    <button class="btn btn-sm" type="button" data-add-schedule style="margin-left:8px">+ 추가</button></div>
    <div class="info-grid">${sch.length ? sch.map(item=>scheduleCard(item, ch.id)).join("") : `<div class="muted" style="font-size:12px;padding:4px 2px">없음</div>`}</div>`;
  host.innerHTML = `<div class="card wide">${html}</div>`;
  host.querySelectorAll("[data-sn-save]").forEach(b=>{ b.addEventListener("click", ()=>saveSubnode(b));
    attachAutosave(b.closest(".sn-card"), ()=>saveSubnode(b, true), ()=>b.isConnected); });
  host.querySelectorAll("[data-sched-edit]").forEach(b=>b.addEventListener("click", ()=>{
    const s = (ch.schedules||[]).find(x=>x.id===b.dataset.sid);
    if(s) editScheduleFlow(ch.id, s);
  }));
  const addSchedBtn = host.querySelector("[data-add-schedule]");
  if(addSchedBtn) addSchedBtn.addEventListener("click", ()=>editScheduleFlow(ch.id, { recurrence:"daily", status:"active" }, true));
  host.querySelectorAll("[data-add-subnode]").forEach(b=>b.addEventListener("click", ()=>addSubnodeFlow(ch.id, b.dataset.addSubnode)));
}

const WEEKDAYS_KO = ["일","월","화","수","목","금","토"];
const SCHED_RECURRENCES = ["daily","weekly","monthly","yearly","once","etc"];

function scheduleWhenSummary(item){
  const rec = item.recurrence || "weekly";
  const times = (item.start_time || item.end_time) ? `${item.start_time||"?"}~${item.end_time||"?"}` : "";
  if(rec==="weekly"){ const d = (item.day_of_weeks||[]).map(n=>WEEKDAYS_KO[n]).filter(Boolean).join(""); return (d?`[${d}] `:"") + times; }
  if(rec==="etc"){ return "불규칙"; }
  if(rec==="daily"){ return times; }
  return `${item.date||""} ${times}`.trim();
}

function scheduleCard(item, charId){
  const title = item.name || item.activity || item.id || "(스케줄)";
  const edit = item.edit || {};
  const canEdit = edit.editable !== false;  // 소스에서 owner_id=self.id 로 위치 가능한 호출만 편집
  const meta = [item.recurrence||"weekly", scheduleWhenSummary(item), item.location_id, item.status].filter(Boolean).join(" · ");
  const foot = canEdit
    ? `<div class="sn-foot" style="margin-top:10px"><button class="btn btn-sm" data-sched-edit data-cid="${attr(charId)}" data-sid="${attr(item.id)}">✎ 편집</button></div>`
    : `<div class="sn-foot" style="margin-top:8px"><span class="muted" style="font-size:10px">읽기 전용 (${esc(koReason(edit.reason || "matching insert_schedule call is computed or shared; edit in source"))})</span></div>`;
  return `<div class="info-card2 sn-card" data-sid="${attr(item.id)}"><div class="ic-title">${esc(title)}</div>
    <div class="card-meta mono" style="margin-bottom:6px">${esc(item.id||"")}</div>
    <div style="font-size:12px;color:var(--t2)">${esc(meta)}</div>
    ${item.prompt_hint?`<div style="font-size:11px;color:var(--t3);margin-top:6px;white-space:pre-wrap">${esc(item.prompt_hint)}</div>`:""}
    ${foot}</div>`;
}

function editScheduleFlow(charId, sched, isNew){
  let rec = SCHED_RECURRENCES.includes(sched.recurrence) ? sched.recurrence : "weekly";
  const dows = new Set((sched.day_of_weeks||[]).map(Number));
  // etc 항목 상태 (date 가 JSON 리스트면 파싱)
  let etcRows = [];
  try{
    const raw = typeof sched.date==="string" && sched.date.trim().startsWith("[") ? JSON.parse(sched.date) : (Array.isArray(sched.date)?sched.date:null);
    if(Array.isArray(raw)) etcRows = raw.map(e=>({date:(e.date||"").replace(/\./g,"-"), start_time:e.start_time||"", end_time:e.end_time||""}));
  }catch(_){}
  const dateDash = String(sched.date||"").replace(/\./g,"-");
  const onceVal = /^\d{4}-\d{2}-\d{2}$/.test(dateDash) ? dateDash : "";
  const yearlyVal = /^\d{1,2}-\d{1,2}$/.test(dateDash) ? `2000-${dateDash.split("-").map(p=>p.padStart(2,"0")).join("-")}` : "";
  const monthlyVal = /^\d{1,2}$/.test(String(sched.date||"").trim()) ? String(sched.date).trim() : "";

  const timeRow = `<div class="field-2col">
    <div class="field"><label class="flabel">start_time</label><input type="time" class="finput" id="sf-start" value="${attr(sched.start_time||"")}"></div>
    <div class="field"><label class="flabel">end_time</label><input type="time" class="finput" id="sf-end" value="${attr(sched.end_time||"")}"></div></div>`;

  function condHtml(){
    if(rec==="daily") return timeRow;
    if(rec==="weekly") return `<div class="field"><label class="flabel">day_of_weeks 요일</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap">${WEEKDAYS_KO.map((d,i)=>`<label class="btn btn-sm" style="cursor:pointer"><input type="checkbox" class="sf-dow" data-d="${i}" ${dows.has(i)?"checked":""} style="margin-right:4px">${d}</label>`).join("")}</div></div>${timeRow}`;
    if(rec==="monthly") return `<div class="field"><label class="flabel">매달 며칠 (1~31)</label><input type="number" min="1" max="31" class="finput" id="sf-monthly" value="${attr(monthlyVal)}"></div>${timeRow}`;
    if(rec==="yearly") return `<div class="field"><label class="flabel">날짜 (매년 월.일)</label><input type="date" class="finput" id="sf-yearly" value="${attr(yearlyVal)}"><div class="fhint">연도는 무시하고 월·일만 사용합니다.</div></div>${timeRow}`;
    if(rec==="once") return `<div class="field"><label class="flabel">날짜 (yyyy-mm-dd)</label><input type="date" class="finput" id="sf-once" value="${attr(onceVal)}"></div>${timeRow}`;
    if(rec==="etc") return `<div class="field"><label class="flabel">불규칙 일정 <span class="muted">(날짜별 시간)</span></label>
      <div id="sf-etc-rows"></div>
      <button class="btn btn-sm" type="button" id="sf-etc-add" style="margin-top:6px">+ 날짜 추가</button></div>`;
    return "";
  }
  function renderEtc(overlay){
    const host = overlay.querySelector("#sf-etc-rows");
    if(!host) return;
    host.innerHTML = etcRows.map((r,i)=>`<div class="field-2col" data-etc="${i}" style="align-items:end;gap:6px;margin-bottom:6px">
      <input type="date" class="finput sf-etc-date" value="${attr(r.date)}">
      <input type="time" class="finput sf-etc-start" value="${attr(r.start_time)}" title="start">
      <input type="time" class="finput sf-etc-end" value="${attr(r.end_time)}" title="end">
      <button class="btn btn-sm btn-cancel sf-etc-del" type="button" data-i="${i}">삭제</button></div>`).join("") || `<div class="muted" style="font-size:12px">없음</div>`;
    host.querySelectorAll(".sf-etc-del").forEach(b=>b.addEventListener("click", ()=>{ collectEtc(overlay); etcRows.splice(Number(b.dataset.i),1); renderEtc(overlay); }));
  }
  function collectEtc(overlay){
    const rows = [...overlay.querySelectorAll("#sf-etc-rows [data-etc]")];
    etcRows = rows.map(r=>({ date:r.querySelector(".sf-etc-date").value, start_time:r.querySelector(".sf-etc-start").value, end_time:r.querySelector(".sf-etc-end").value }));
  }

  openModal({
    title: isNew ? "스케줄 추가" : `스케줄 편집: ${sched.id}`, icon:"🗓", submitLabel: isNew ? "추가" : "저장",
    bodyHtml:`
      ${isNew?`<div class="field"><label class="flabel">schedule_id <span class="muted">(고유 식별자)</span></label><input class="finput mono" id="sf-id" placeholder="${attr(charId+'_')}"></div>`:""}
      <div class="field"><label class="flabel">name 이름</label><input class="finput" id="sf-name" value="${attr(sched.name||"")}"></div>
      <div class="field"><label class="flabel">recurrence 반복</label>
        <select class="fselect" id="sf-rec">${SCHED_RECURRENCES.map(r=>`<option value="${r}"${r===rec?" selected":""}>${r}</option>`).join("")}</select></div>
      <div id="sched-cond"></div>
      <div class="field-2col">
        <div class="field"><label class="flabel">location_id</label><input class="finput mono" id="sf-loc" value="${attr(sched.location_id||"")}"></div>
        <div class="field"><label class="flabel">status</label><input class="finput" id="sf-status" value="${attr(sched.status||"active")}"></div></div>
      <div class="field"><label class="flabel">material <span class="muted">(JSON 또는 텍스트)</span></label><textarea class="ftext" id="sf-material" rows="2">${esc(sched.material||"")}</textarea></div>
      <div class="field"><label class="flabel">summary</label><textarea class="ftext" id="sf-summary" rows="2">${esc(sched.summary||"")}</textarea></div>
      <div class="field"><label class="flabel">prompt_hint</label><textarea class="ftext" id="sf-hint" rows="2">${esc(sched.prompt_hint||"")}</textarea></div>
      <div class="field-2col">
        <div class="field"><label class="flabel">activity</label><input class="finput" id="sf-activity" value="${attr(sched.activity||"")}"></div>
        <div class="field"><label class="flabel">prompt_priority</label><input type="number" class="finput" id="sf-prio" value="${attr(sched.prompt_priority??0)}"></div></div>
      <div class="field"><label class="flabel">tags <span class="muted">(쉼표 구분)</span></label><input class="finput" id="sf-tags" value="${attr((sched.tags||[]).join(', '))}"></div>`,
    onMount:(overlay)=>{
      const cond = overlay.querySelector("#sched-cond");
      const draw = ()=>{ cond.innerHTML = condHtml(); if(rec==="etc"){ renderEtc(overlay); overlay.querySelector("#sf-etc-add").addEventListener("click", ()=>{ collectEtc(overlay); etcRows.push({date:"",start_time:"",end_time:""}); renderEtc(overlay); }); } };
      draw();
      overlay.querySelector("#sf-rec").addEventListener("change", e=>{ rec = e.target.value; draw(); });
    },
    onSubmit: async (overlay)=>{
      const val = id=>{ const el = overlay.querySelector(id); return el ? el.value.trim() : ""; };
      const fields = {
        recurrence: rec, name: val("#sf-name"), location_id: val("#sf-loc"), status: val("#sf-status"),
        material: val("#sf-material"), summary: val("#sf-summary"), prompt_hint: val("#sf-hint"),
        activity: val("#sf-activity"), prompt_priority: Number(val("#sf-prio"))||0,
        tags: val("#sf-tags").split(",").map(s=>s.trim()).filter(Boolean),
      };
      if(rec==="daily" || rec==="weekly" || rec==="monthly" || rec==="yearly" || rec==="once"){
        fields.start_time = val("#sf-start"); fields.end_time = val("#sf-end");
      }
      if(rec==="weekly"){ fields.day_of_weeks = [...overlay.querySelectorAll(".sf-dow:checked")].map(c=>Number(c.dataset.d)); }
      else if(rec==="monthly"){ fields.date = val("#sf-monthly"); }
      else if(rec==="yearly"){ const v = val("#sf-yearly"); const p = v.split("-"); fields.date = p.length===3 ? `${p[1]}.${p[2]}` : ""; }
      else if(rec==="once"){ fields.date = val("#sf-once"); }
      else if(rec==="etc"){ collectEtc(overlay); fields.date = JSON.stringify(etcRows.filter(r=>r.date)); }
      const scheduleId = isNew ? val("#sf-id") : sched.id;
      if(isNew && !scheduleId){ toast("schedule_id 를 입력하세요","e"); return false; }
      const endpoint = isNew ? "schedule/add" : "schedule/rewrite";
      try{
        const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(charId)}/${endpoint}`, { schedule_id: scheduleId, fields });
        if(!handleSaveResult(res)) return false;
        await refreshGraphOnly().then(()=>{ const g=curGraph(); const c=g?.characters?.find(x=>x.id===charId); if(c) renderCharCard(c); else renderCharacters(); });
        return true;
      }catch(err){ toast("저장 실패: "+err.message, "e"); return false; }
    },
  });
}

function subnodeCard(item, sec, charId){
  const title = item.name || item.title || item.id || "(이름 없음)";
  // id/owner_id/내부키는 숨기고 나머지를 편집 필드로 노출.
  const keys = Object.keys(item).filter(k=>k!=="id" && k!=="owner_id" && !k.startsWith("_"));
  const rows = keys.map(k=>{
    const v = item[k];
    const t = Array.isArray(v) ? "arr" : (typeof v==="number" ? "num" : (typeof v==="boolean" ? "bool" : "str"));
    const val = (v===undefined||v===null) ? "" : (Array.isArray(v) ? v.join(", ") : String(v));
    let inp;
    if(!sec.editable){ inp = `<div class="sn-ro" style="color:var(--t2);font-size:12px;white-space:pre-wrap">${esc(val)||"—"}</div>`; }
    else if(k.endsWith("_at")){ inp = `<input type="datetime-local" class="finput sn-input" data-f="${attr(k)}" data-t="datetime" value="${attr(toDatetimeLocal(val))}">`; }
    else if(t==="bool"){ inp = `<select class="finput sn-input" data-f="${attr(k)}" data-t="bool"><option value="true"${v?" selected":""}>true</option><option value="false"${!v?" selected":""}>false</option></select>`; }
    else if(val.length>46){ inp = `<textarea class="finput sn-input" data-f="${attr(k)}" data-t="${t}" rows="2">${esc(val)}</textarea>`; }
    else { inp = `<input class="finput sn-input" data-f="${attr(k)}" data-t="${t}" value="${attr(val)}">`; }
    return `<div class="sn-field" style="margin-bottom:8px"><label class="flabel"${keyHelp(k)?` title="${attr(keyHelp(k))}"`:""}>${esc(k)}${keyInfo(k)}${t==="arr"?' <span class="muted">(쉼표 구분)</span>':''}</label>${inp}</div>`;
  }).join("");
  const foot = sec.editable
    ? `<div class="sn-foot" style="margin-top:10px"><button class="save-btn btn-sm" data-sn-save data-cid="${attr(charId)}" data-nid="${attr(item.id)}">💾 저장</button></div>`
    : `<div class="sn-foot" style="margin-top:8px"><span class="muted" style="font-size:10px">읽기 전용 (insert_schedule kwargs — 소스에서 편집)</span></div>`;
  return `<div class="info-card2 sn-card" data-nid="${attr(item.id)}"><div class="ic-title">${esc(title)}</div>${rows}${foot}</div>`;
}

async function saveSchedule(btn, quiet=false){
  const card = btn.closest(".sn-card");
  if(!card) return;
  const cid = btn.dataset.cid, sid = btn.dataset.sid;
  const fields = {};
  card.querySelectorAll(".sn-input").forEach(el=>{
    const f = el.dataset.f, t = el.dataset.t; let v = el.value;
    if(t==="num"){ const n = Number(v); if(v.trim()!=="" && !isNaN(n)) v = n; }
    else if(t==="bool"){ v = (v==="true"); }
    else if(t==="arr"){
      v = v.split(",").map(s=>s.trim()).filter(Boolean);
      if(f==="day_of_weeks") v = v.map(s=>Number(s)).filter(n=>Number.isFinite(n));
    }
    fields[f] = v;
  });
  const orig = btn.textContent; btn.disabled = true; btn.textContent = "저장 중…";
  try{
    const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(cid)}/schedule`, { schedule_id:sid, fields });
    const ok = handleSaveResult(res, quiet);
    if(ok){ await refreshGraphOnly(); if(!quiet){ const g=curGraph(); const c=g?.characters?.find(x=>x.id===cid); if(c) renderCharCard(c); else renderCharacters(); } }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("저장 실패: "+err.message, "e"); }
  finally{ btn.disabled = false; btn.textContent = orig; }
}
async function saveSubnode(btn, quiet=false){
  const card = btn.closest(".sn-card");
  if(!card) return;
  const cid = btn.dataset.cid, nid = btn.dataset.nid;
  const fields = {};
  card.querySelectorAll(".sn-input").forEach(el=>{
    const f = el.dataset.f, t = el.dataset.t; let v = el.value;
    if(t==="num"){ const n = Number(v); if(v.trim()!=="" && !isNaN(n)) v = n; }
    else if(t==="bool"){ v = (v==="true"); }
    else if(t==="arr"){ v = v.split(",").map(s=>s.trim()).filter(Boolean); }
    else if(t==="datetime"){ v = fromDatetimeLocal(v); }
    fields[f] = v;
  });
  const orig = btn.textContent; btn.disabled = true; btn.textContent = "저장 중…";
  try{
    const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/characters/${encodeURIComponent(cid)}/subnode`, { node_id:nid, fields });
    handleSaveResult(res, quiet);
    if(res.ok){ await refreshGraphOnly(); if(!quiet){ const g=curGraph(); const c=g?.characters?.find(x=>x.id===cid); if(c) renderCharCard(c); else renderCharacters(); } }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("저장 실패: "+err.message, "e"); }
  finally{ btn.disabled = false; btn.textContent = orig; }
}

   RELATIONSHIPS  (Cytoscape; edge PUT #7)

function renderRelationships(){
  sectionPane.style.padding = "0";
  const g = curGraph();
  if(!g){ sectionPane.style.padding=""; sectionPane.innerHTML = `<div class="pane-inner">${graphErrorCard()}</div>`; return; }
  sectionPane.innerHTML = `
    <div class="rel-layout">
      <div class="cy-wrap">

        </div>

          <div class="cy-legend-row"><span class="cy-legend-dot" style="background:${NODE_COL.character}"></span> 캐릭터</div>

          <div class="cy-legend-row" style="color:var(--t3)">엣지 클릭 → 우측 편집 · 우클릭 빈 곳 → 포커스 해제</div>

    </div>`;

  if(!window.cytoscape){
    renderRelFallback(g);
    return;
  }
  buildCytoscape(g);

  $("cy-fit").addEventListener("click", ()=>{ if(state.cy) state.cy.fit(undefined, 40); });
  const focusSel = $("cy-focus");
  focusSel.innerHTML = `<option value="">노드 포커스…</option>` + (g.characters||[]).map(c=>`<option value="${attr(c.id)}">${esc(c.name||c.id)}</option>`).join("");
  focusSel.addEventListener("change", ()=> focusNode(focusSel.value));
}

function buildCytoscape(g){
  const chars = g.characters || [];
  const rels = g.relationships || [];
  const charSet = new Set(chars.map(c=>c.id));

  const elements = [];
  chars.forEach(c=>{
    elements.push({ data:{ id:c.id, label:c.name||c.id, kind:"char" } });
  });
  // endpoints referenced by rels but not in chars (defensive)
  rels.forEach(r=>{
    [r.source, r.target].forEach(id=>{
      if(id && !charSet.has(id)){ charSet.add(id); elements.push({ data:{ id, label:id, kind:"ghost" } }); }
    });
  });
  rels.forEach((r,idx)=>{
    elements.push({ data:{
      id:`e${idx}`, source:r.source, target:r.target,
      label:r.type||"", affinity:r.affinity, trust:r.trust,
      editable: r.editable!==false, _ref: idx,
    }});
  });

  const cy = cytoscape({
    container: $("cy"),
    elements,
    minZoom:0.2, maxZoom:2.5, wheelSensitivity:0.2,
    style:[
      { selector:"node", style:{
        "background-color":"#15243b", "border-color":NODE_COL.character, "border-width":2,
        "label":"data(label)", "color":"#f4f8fd", "font-size":"11px", "font-weight":"600",
        "text-valign":"bottom", "text-margin-y":6, "width":40, "height":40,
        "text-background-color":"#070a0f", "text-background-opacity":0.7, "text-background-padding":3,
        "font-family":"Pretendard, sans-serif",
      }},
      { selector:'node[kind="ghost"]', style:{ "border-color":"#94a3b8", "background-color":"#18212e" }},
      { selector:"node:selected", style:{ "border-color":"#f4f8fd", "border-width":3 }},
      { selector:".faded", style:{ "opacity":0.18 }},
      { selector:"edge", style:{
        "curve-style":"bezier", "control-point-step-size":48,
        "width":"mapData(trust,0,100,1.4,4)",
        "line-color":NODE_COL.character, "line-opacity":0.5,
        "target-arrow-color":NODE_COL.character, "target-arrow-shape":"triangle", "arrow-scale":1.1,
        "label":"data(label)", "font-size":"9px", "color":"rgba(244,248,253,.56)",
        "text-rotation":"autorotate", "text-background-color":"#070a0f", "text-background-opacity":0.6, "text-background-padding":2,
        "font-family":"Pretendard, sans-serif",
      }},
      { selector:"edge:selected", style:{ "line-color":"#3b82f6", "line-opacity":1, "target-arrow-color":"#3b82f6", "width":4, "z-index":99 }},
      { selector:'edge[!editable]', style:{ "line-style":"dashed", "line-opacity":0.35 }},
    ],
    layout:{ name:"cose", animate:false, padding:50, nodeRepulsion:9000, idealEdgeLength:120, gravity:0.3 },
  });
  state.cy = cy;

  cy.on("tap","edge", evt=>{
    const ed = evt.target;
    cy.elements().removeClass("faded");
    state.selectedEdge = { source:ed.data("source"), target:ed.data("target") };
    renderEdgePanel(ed.data());
  });
  cy.on("tap","node", evt=>{
    focusNode(evt.target.id());
    $("cy-focus").value = evt.target.id();
  });
  cy.on("tap", evt=>{
    if(evt.target===cy){ cy.elements().removeClass("faded"); cy.$(":selected").unselect(); state.selectedEdge=null; renderEdgePanel(null); }
  });

  setTimeout(()=>{ try{ cy.fit(undefined,40); }catch(_){} }, 60);
}

function focusNode(id){
  const cy = state.cy;
  if(!cy || !id){ if(cy) cy.elements().removeClass("faded"); return; }
  const node = cy.getElementById(id);
  if(!node || node.empty()){ cy.elements().removeClass("faded"); return; }
  const nbhd = node.closedNeighborhood();
  cy.elements().addClass("faded");
  nbhd.removeClass("faded");
  cy.animate({ fit:{ eles:nbhd, padding:80 } }, { duration:300 });
}

        </div>

        </div>
      </div>
      <div class="field"><label class="flabel">관계 서술 current_status</label><textarea class="ftext" id="rel-status" rows="4" ${dis}>${esc(rel.current_status||"")}</textarea></div>
    </div>
    ${editable?`<div style="margin-top:18px;display:flex;flex-direction:column;gap:9px">

  if(editable){

    attachAutosave($("rel-side-body"), ()=>saveRelationship(edgeData.source, edgeData.target, true), ()=>$("rel-save")?.isConnected);
    $("rel-delete").addEventListener("click", ()=> deleteRelationship(edgeData.source, edgeData.target, srcName, tgtName));
