<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GraphRAG World Editor</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Base — black + blue */
  --bg:#070a0f; --s1:#0c111a; --s2:#121a27; --s3:#1a2536;
  /* Text */
  --t1:#f4f8fd; --t2:rgba(244,248,253,.56); --t3:rgba(244,248,253,.30);
  /* Borders */
  --b1:rgba(255,255,255,.06); --b2:rgba(255,255,255,.11); --b3:rgba(255,255,255,.18);
  /* Accent — blue */
  --ac:#3b82f6; --ac-dim:rgba(59,130,246,.14); --ac-glow:rgba(59,130,246,.32);
  /* Status */
  --ok:#34d399; --er:#f87171; --warn:#fbbf24;
  /* Node type colors (cool / blue-leaning, distinguishable, no purple primary) */
  --nc:#60a5fa; --nl:#34d399; --ne:#fbbf24; --ns:#22d3ee;
  --ng:#94a3b8; --ni:#818cf8; --nf:#2dd4bf; --np:#fb7185;
}

html, body { height:100%; background:var(--bg); color:var(--t1);
  font-family:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size:13px; overflow:hidden; }

body { display:grid; grid-template-rows:56px 1fr; }

/* ─── HEADER ─────────────────────────────────────── */
header {
  display:flex; align-items:center; gap:12px; padding:0 18px;
  background:var(--s1); border-bottom:1px solid var(--b1); position:relative; z-index:30;
}
header::after {
  content:""; position:absolute; bottom:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--ac-glow) 30%, rgba(96,165,250,.2) 70%, transparent);
}
.brand { display:flex; align-items:center; gap:9px; flex-shrink:0; }
.brand-logo {
  width:28px; height:28px; border-radius:8px;
  background:linear-gradient(135deg,#1e3a8a,#2563eb);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; box-shadow:0 0 0 1px rgba(59,130,246,.4), 0 4px 12px rgba(0,0,0,.4);
}
.brand-name { font-size:14px; font-weight:700; letter-spacing:-.02em; color:var(--t1); }
.brand-ver { font-size:10px; color:var(--t3); margin-left:2px; }
.hdiv { width:1px; height:20px; background:var(--b2); flex-shrink:0; }

.ctl {
  height:30px; background:var(--s2); border:1px solid var(--b2);
  border-radius:7px; color:var(--t1); font-size:12px; padding:0 10px;
  outline:none; transition:border-color .15s, box-shadow .15s; font-family:inherit;
}
.ctl:focus { border-color:var(--ac); box-shadow:0 0 0 3px var(--ac-dim); }
#world-select { width:190px; }

/* Scenario tabs */
.scn-tabs { display:flex; align-items:center; gap:5px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
.scn-tabs::-webkit-scrollbar { display:none; }
.scn-tab {
  height:28px; padding:0 13px; border-radius:99px; border:1px solid var(--b2);
  background:var(--s2); color:var(--t2); font-size:11.5px; font-weight:600;
  cursor:pointer; white-space:nowrap; font-family:inherit; flex-shrink:0; transition:all .14s;
}
.scn-tab:hover { color:var(--t1); border-color:var(--b3); }
.scn-tab.active { background:var(--ac-dim); border-color:rgba(59,130,246,.45); color:var(--ac); }

.btn {
  height:30px; padding:0 13px; border-radius:7px; border:1px solid var(--b2);
  background:var(--s2); color:var(--t1); font-size:12px; font-weight:600;
  cursor:pointer; transition:all .15s; font-family:inherit; white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover { border-color:var(--b3); background:var(--s3); }
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
.btn-v { background:var(--ac-dim); border-color:rgba(59,130,246,.35); color:var(--ac); }
.btn-v:hover { background:rgba(59,130,246,.22); border-color:rgba(59,130,246,.55); }
.btn-sm { height:26px; padding:0 10px; font-size:11px; border-radius:6px; }
.btn-danger-sm { background:rgba(239,68,68,.15); color:#f87171; border-color:rgba(239,68,68,.3); }
.btn-danger-sm:hover { background:rgba(239,68,68,.28); }
.btn-cancel { background:rgba(248,113,113,.1); border-color:rgba(248,113,113,.3); color:var(--er); }
.btn-cancel:hover { background:rgba(248,113,113,.18); }
.mode-toggle { display:flex; gap:3px; padding:3px; border:1px solid var(--b2); border-radius:8px; background:var(--s2); }
.mode-btn {
  height:24px; padding:0 10px; border:0; border-radius:6px; background:transparent;
  color:var(--t2); font:600 11px inherit; cursor:pointer; white-space:nowrap;
}
.mode-btn.active { background:var(--ac-dim); color:var(--ac); }
.mode-btn:disabled { cursor:default; }   /* stepper 현재 단계 표시(클릭 불가) */
.st-rows { display:flex; flex-direction:column; gap:6px; }
.st-row { display:flex; gap:8px; align-items:center; }
.st-row .st-name { flex:0 0 160px; }
.st-row .st-desc { flex:1; min-width:0; }
.st-row .st-del { flex:0 0 auto; }

/* Save status indicator */
.save-status {
  margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0; max-width:46vw;
}
.status-pill {
  display:flex; align-items:center; gap:7px; padding:0 11px; height:30px; min-width:0;
  border-radius:8px; background:var(--s2); border:1px solid var(--b1); font-size:11.5px; color:var(--t2);
  transition:all .2s;
}
.status-pill.ok { background:rgba(52,211,153,.1); border-color:rgba(52,211,153,.3); color:var(--ok); }
.status-pill.er { background:rgba(248,113,113,.1); border-color:rgba(248,113,113,.3); color:var(--er); }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--t3); flex-shrink:0; }
.status-pill.ok .status-dot { background:var(--ok); box-shadow:0 0 6px var(--ok); }
.status-pill.er .status-dot { background:var(--er); box-shadow:0 0 6px var(--er); }
.status-msg { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:340px; }
.status-bak {
  font-size:9.5px; color:var(--t3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px;
}

/* ─── BODY GRID ──────────────────────────────────── */
.app-body { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:0; overflow:hidden; }

/* ─── SECTION NAV SIDEBAR ────────────────────────── */
.nav-panel {
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
  background:var(--s1); border-right:1px solid var(--b1);
}
.nav-head {
  flex-shrink:0; height:42px; padding:0 16px; display:flex; align-items:center;
  font-size:11px; font-weight:800; color:var(--t2); letter-spacing:.06em; text-transform:uppercase;
  border-bottom:1px solid var(--b1);
}
.nav-list { flex:1; min-height:0; overflow-y:auto; padding:10px; scrollbar-width:thin; scrollbar-color:var(--b2) transparent; }
.nav-item {
  width:100%; height:42px; margin-bottom:5px; padding:0 12px;
  display:flex; align-items:center; gap:11px;
  border:1px solid transparent; border-radius:9px; background:transparent;
  color:var(--t2); cursor:pointer; text-align:left; font-family:inherit; font-size:13px; font-weight:600;
  transition:all .14s;
}
.nav-item:hover { background:var(--s2); color:var(--t1); }
.nav-item.active { background:rgba(59,130,246,.12); border-color:rgba(59,130,246,.4); color:var(--t1); }
.nav-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; opacity:.9; }
.nav-item.active .nav-icon { color:var(--ac); }
.nav-badge {
  margin-left:auto; min-width:18px; height:18px; padding:0 5px; border-radius:99px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--s3); color:var(--t3); font-size:10px; font-weight:700;
}
.nav-item.active .nav-badge { background:rgba(59,130,246,.2); color:var(--ac); }

.nav-foot { flex-shrink:0; padding:12px; border-top:1px solid var(--b1); }
.nav-meta { font-size:10px; color:var(--t3); line-height:1.7; }
.nav-meta b { color:var(--t2); font-weight:700; }

/* ─── MAIN AREA ──────────────────────────────────── */
.main-area { position:relative; min-height:0; overflow:hidden; display:flex; flex-direction:column; }
.section-pane { flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--b2) transparent; }
.section-pane::-webkit-scrollbar { width:10px; }
.section-pane::-webkit-scrollbar-thumb { background:var(--b2); border-radius:6px; border:3px solid var(--s1); }

.pane-inner { max-width:1200px; margin:0 auto; padding:34px 40px 96px; }
.pane-header { margin-bottom:28px; padding-bottom:18px; border-bottom:1px solid var(--b1); position:relative; }
.pane-header::after { content:""; position:absolute; left:0; bottom:-1px; width:48px; height:2px; border-radius:2px;
  background:linear-gradient(90deg, var(--ac), var(--ac-glow)); }
.pane-title { font-size:24px; font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:11px; }
.pane-sub { margin-top:8px; font-size:12.5px; color:var(--t2); line-height:1.65; max-width:760px; }
.pane-title .pt-icon { font-size:21px; }

/* ─── CARD ───────────────────────────────────────── */
.card {
  background:var(--s1); border:1px solid var(--b1); border-radius:14px;
  padding:24px 26px; margin-bottom:22px; box-shadow:0 6px 24px rgba(0,0,0,.28);
  transition:border-color .15s, box-shadow .15s;
}
.card:hover { border-color:var(--b2); }
.card.wide { padding:28px 30px; }
.card-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--b1); }
.card-head-main { flex:1; min-width:0; }
.card-title { font-size:16px; font-weight:700; letter-spacing:-.01em; overflow-wrap:anywhere; display:flex; align-items:center; gap:8px; }
.card-meta { margin-top:4px; font-size:11.5px; color:var(--t2); overflow-wrap:anywhere; }
.card-actions { flex-shrink:0; display:flex; gap:7px; align-items:center; }

/* Read-only note */
.ro-note {
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:99px;
  background:rgba(148,163,184,.1); border:1px solid rgba(148,163,184,.22);
  color:var(--t2); font-size:10.5px; font-weight:600;
}
.ro-note::before { content:"🔒"; font-size:10px; }

/* Field rows */
.field-grid { display:grid; gap:14px; }
.field { display:flex; flex-direction:column; gap:6px; }
.field-2col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.field-3col { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media (max-width:760px){ .field-2col,.field-3col { grid-template-columns:1fr; } }
.flabel { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--t3); display:flex; align-items:center; gap:6px; }
.finput, .ftext, .fselect {
  width:100%; background:var(--s2); border:1px solid var(--b2); border-radius:8px;
  color:var(--t1); font-size:13px; padding:8px 11px; font-family:inherit; outline:none;
  transition:border-color .14s, box-shadow .14s; line-height:1.5;
}
.ftext { resize:vertical; min-height:70px; }
textarea { resize:vertical; }  /* 모든 textarea는 세로로만 확장 (가로 확장 방지) */
.finput:focus, .ftext:focus, .fselect:focus { border-color:var(--ac); box-shadow:0 0 0 3px var(--ac-dim); }
.finput:disabled, .ftext:disabled, .fselect:disabled { opacity:.6; cursor:not-allowed; background:rgba(255,255,255,.02); }
.finput.num { font-variant-numeric:tabular-nums; }
.fhint { font-size:10.5px; color:var(--t3); line-height:1.5; }

/* Chips/tags input */
.chip-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.chip {
  display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:99px;
  background:var(--s3); border:1px solid var(--b2); font-size:11px; color:var(--t1);
}
.chip-x { background:none; border:none; color:var(--t3); cursor:pointer; font-size:13px; line-height:1; padding:0; font-family:inherit; }
.chip-x:hover { color:var(--er); }
.chip-add {
  background:transparent; border:1px dashed var(--b3); color:var(--t2);
  padding:3px 9px; border-radius:99px; font-size:11px; cursor:pointer; font-family:inherit;
}
.chip-add:hover { border-color:var(--ac); color:var(--ac); }
.chip-tag { background:rgba(96,165,250,.1); border-color:rgba(96,165,250,.25); color:#93c5fd; }
.chip-link { background:rgba(52,211,153,.1); border-color:rgba(52,211,153,.25); color:#6ee7b7; }
.chip-scn { background:rgba(129,140,248,.1); border-color:rgba(129,140,248,.3); color:var(--ni); }

/* Schedule template editor */
.sched-editor { display:flex; flex-direction:column; gap:18px; }
.sched-toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.sched-list { display:flex; flex-direction:column; gap:10px; }
.sched-entry {
  border:1px solid var(--b1); border-radius:10px; background:var(--s2); padding:12px;
  display:grid; gap:10px;
}
.sched-entry-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sched-entry-title { font-size:12px; font-weight:700; color:var(--t2); overflow-wrap:anywhere; }
.sched-empty { padding:16px; border:1px dashed var(--b2); border-radius:10px; color:var(--t3); font-size:12px; }
.sched-section { border-top:1px solid var(--b1); padding-top:16px; }

/* KV editor rows (character blobs) */
.kv-list { display:flex; flex-direction:column; gap:9px; }
.kv-edit {
  display:grid; grid-template-columns:200px 1fr auto; gap:10px; align-items:start;
  padding:10px 12px; border:1px solid var(--b1); border-radius:10px; background:var(--s2);
  transition:border-color .14s;
}
.kv-edit:hover { border-color:var(--b2); }
.kv-edit.custom { border-color:rgba(45,212,191,.25); background:rgba(45,212,191,.04); }
.kv-edit.inherited .finput::placeholder, .kv-edit.inherited .ftext::placeholder { color:var(--t3); font-style:italic; }
.kv-edit-key {
  font-size:11.5px; font-weight:700; color:var(--t2); padding-top:8px;
  overflow-wrap:anywhere; display:flex; flex-direction:column; gap:3px;
}
.kv-custom-badge { font-size:8.5px; font-weight:700; color:var(--nf); letter-spacing:.04em; }
.ft-sel {
  margin-top:4px; height:20px; font-size:10px; padding:0 4px;
  background:var(--s1); border:1px solid var(--b1); border-radius:4px;
  color:var(--t3); width:100%; cursor:pointer; font-family:inherit;
  transition:border-color .12s, color .12s;
}
.ft-sel:hover, .ft-sel:focus { border-color:var(--b2); color:var(--t2); outline:none; }
.ft-sel.ft-set { border-color:rgba(59,130,246,.35); color:var(--ac); }
.kv-edit-val .ftext { min-height:40px; }
.kv-del {
  align-self:start; margin-top:5px; width:28px; height:28px; border-radius:7px;
  border:1px solid var(--b2); background:var(--s3); color:var(--t3); cursor:pointer; font-family:inherit;
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
}
.kv-del:hover { color:var(--er); border-color:rgba(248,113,113,.4); }
.kv-del:disabled { opacity:.3; cursor:not-allowed; }
@media (max-width:680px){ .kv-edit { grid-template-columns:1fr; } .kv-edit-key { padding-top:0; } }

/* add-key row */
.addkey-row { display:flex; gap:8px; margin-top:12px; align-items:center; }
.addkey-row .finput { flex:1; }

/* Tabs (character card) */
.tab-bar2 { display:flex; gap:4px; border-bottom:1px solid var(--b1); margin-bottom:18px; overflow-x:auto; scrollbar-width:none; }
.tab-bar2::-webkit-scrollbar { display:none; }
.tab-btn2 {
  height:38px; padding:0 16px; border:none; border-bottom:2px solid transparent;
  background:transparent; color:var(--t2); font-size:13px; font-weight:600;
  cursor:pointer; white-space:nowrap; font-family:inherit; transition:color .12s; display:flex; align-items:center; gap:7px;
}
.tab-btn2:hover { color:var(--t1); }
.tab-btn2.active { color:var(--ac); border-bottom-color:var(--ac); }
.tab-lock { font-size:11px; opacity:.7; }

/* Save button (per-card) */
.save-btn {
  height:34px; padding:0 18px; border-radius:8px;
  background:var(--ac-dim); border:1px solid rgba(59,130,246,.4);
  color:var(--ac); font-size:12.5px; font-weight:700; cursor:pointer; transition:all .14s; font-family:inherit;
  display:inline-flex; align-items:center; gap:7px;
}
.save-btn:hover { background:rgba(59,130,246,.24); }
.save-btn:disabled { opacity:.45; cursor:not-allowed; }

/* Dirty marker */
.dirty-dot { width:7px; height:7px; border-radius:50%; background:var(--warn); box-shadow:0 0 6px var(--warn); flex-shrink:0; }

/* Empty / loading / error states */
.state-box {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding:60px 24px; text-align:center; color:var(--t3);
}
.state-icon { font-size:44px; opacity:.35; }
.state-text { font-size:13px; line-height:1.7; color:var(--t2); }
.state-sub { font-size:11.5px; color:var(--t3); max-width:520px; line-height:1.6; }
.error-card {
  border:1px solid rgba(248,113,113,.3); background:rgba(248,113,113,.05);
  border-radius:14px; padding:24px; margin-bottom:18px;
}
.error-card .ec-title { font-size:14px; font-weight:700; color:var(--er); display:flex; align-items:center; gap:8px; }
.error-card .ec-body { margin-top:8px; font-size:12px; color:var(--t2); line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:rgba(0,0,0,.3); padding:10px 12px; border-radius:8px; }

.spinner {
  width:32px; height:32px; border-radius:50%;
  border:3px solid var(--b2); border-top-color:var(--ac); animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* Banner */
.banner {
  display:flex; align-items:flex-start; gap:10px; padding:11px 14px; border-radius:10px;
  font-size:12px; line-height:1.6; margin-bottom:14px;
}
.banner-warn { background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.28); color:#fcd34d; }
.banner-info { background:rgba(96,165,250,.08); border:1px solid rgba(96,165,250,.25); color:#93c5fd; }
.banner-ok { background:rgba(52,211,153,.08); border:1px solid rgba(52,211,153,.25); color:#6ee7b7; }
.banner-er { background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.28); color:#fca5a5; }
.banner-icon { flex-shrink:0; font-size:14px; }
.banner ul { margin:4px 0 0 16px; padding:0; }
.banner li { margin:2px 0; }

/* hint chip */
.hint-chip {
  display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:99px;
  background:rgba(59,130,246,.1); border:1px solid rgba(59,130,246,.3); color:var(--nc);
  font-size:11px; font-weight:600;
}
.hint-chip code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; color:var(--t1); background:rgba(0,0,0,.3); padding:1px 5px; border-radius:4px; }

/* ─── PROMPTS SECTION ─────────────────────────────── */
.prompt-layout { display:grid; grid-template-columns:300px minmax(0,1fr); gap:0; height:100%; min-height:0; }
.tree-panel {
  border-right:1px solid var(--b1); background:var(--s1); display:flex; flex-direction:column; min-height:0; overflow:hidden;
}
.tree-head { flex-shrink:0; height:44px; padding:0 16px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--b1); font-size:11px; font-weight:800; color:var(--t2); letter-spacing:.05em; text-transform:uppercase; }
.tree-scroll { flex:1; min-height:0; overflow-y:auto; padding:8px; scrollbar-width:thin; scrollbar-color:var(--b2) transparent; }
.tree-node { user-select:none; }
.tree-row {
  display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:7px; cursor:pointer;
  font-size:12px; color:var(--t1); transition:background .1s; white-space:nowrap; overflow:hidden;
}
.tree-row:hover { background:var(--s2); }
.tree-row.active { background:rgba(59,130,246,.14); color:var(--ac); }
.tree-row.missing { color:var(--warn); font-style:italic; }
.tree-twist { width:14px; flex-shrink:0; text-align:center; color:var(--t3); font-size:9px; transition:transform .12s; }
.tree-twist.open { transform:rotate(90deg); }
.tree-ico { flex-shrink:0; font-size:12px; opacity:.85; }
.tree-label { overflow:hidden; text-overflow:ellipsis; }

}
.tree-children { overflow:hidden; }

.editor-panel { display:flex; flex-direction:column; min-height:0; overflow:hidden; background:var(--bg); }
.editor-bar {

}
.editor-path { font-size:12px; color:var(--t2); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; display:flex; align-items:center; gap:8px; }
.editor-path .ep-kind { padding:2px 7px; border-radius:5px; background:var(--s3); color:var(--t3); font-size:9.5px; text-transform:uppercase; flex-shrink:0; }
.editor-actions { flex-shrink:0; display:flex; gap:8px; align-items:center; }
.editor-split { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; }
.editor-split.no-preview { grid-template-columns:1fr; }
.monaco-wrap { min-height:0; border-right:1px solid var(--b1); position:relative; }
#monaco-host { position:absolute; inset:0; }
#monaco-fallback {
  position:absolute; inset:0; width:100%; height:100%; resize:none; border:none; outline:none;
  background:var(--bg); color:var(--t1); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px; line-height:1.6; padding:14px 16px; display:none;
}
.preview-wrap { min-height:0; overflow-y:auto; background:var(--s1); scrollbar-width:thin; scrollbar-color:var(--b2) transparent; }
.preview-head { padding:9px 16px; font-size:10px; font-weight:800; color:var(--t3); letter-spacing:.06em; text-transform:uppercase; border-bottom:1px solid var(--b1); position:sticky; top:0; background:var(--s1); z-index:2; }
.md-body { padding:18px 22px; font-size:13.5px; line-height:1.75; color:var(--t1); }
.md-body h1,.md-body h2,.md-body h3 { margin:18px 0 10px; line-height:1.3; font-weight:700; letter-spacing:-.01em; }
.md-body h1 { font-size:21px; border-bottom:1px solid var(--b1); padding-bottom:8px; }
.md-body h2 { font-size:17px; color:var(--nc); }
.md-body h3 { font-size:14.5px; color:var(--t1); }
.md-body p { margin:9px 0; color:var(--t1); }
.md-body ul,.md-body ol { margin:9px 0 9px 22px; }
.md-body li { margin:4px 0; }
.md-body code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:var(--s3); padding:2px 6px; border-radius:5px; color:#fbbf24; }
.md-body pre { background:var(--s2); border:1px solid var(--b1); border-radius:8px; padding:12px 14px; overflow-x:auto; margin:10px 0; }
.md-body pre code { background:none; padding:0; color:var(--t1); }
.md-body blockquote { border-left:3px solid var(--ac); padding-left:14px; color:var(--t2); margin:10px 0; }
.md-body a { color:var(--ac); }
.md-body hr { border:none; border-top:1px solid var(--b1); margin:16px 0; }
.md-body table { border-collapse:collapse; margin:10px 0; width:100%; }
.md-body th,.md-body td { border:1px solid var(--b1); padding:6px 10px; text-align:left; font-size:12.5px; }
.md-body th { background:var(--s2); }
.editor-placeholder { flex:1; display:flex; align-items:center; justify-content:center; }

/* ─── RELATIONSHIPS / CYTOSCAPE ───────────────────── */
.rel-layout { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:0; height:100%; min-height:0; }
.cy-wrap { position:relative; background:var(--bg); overflow:hidden; min-height:0; }
.cy-wrap::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px); background-size:28px 28px;
}
#cy { position:absolute; inset:0; z-index:1; }
.cy-legend {
  position:absolute; bottom:14px; left:14px; z-index:3; display:flex; flex-direction:column; gap:6px;
  padding:10px 12px; border-radius:10px; background:rgba(7,10,15,.82); backdrop-filter:blur(8px);
  border:1px solid var(--b1); font-size:10.5px; color:var(--t2); pointer-events:none;
}
.cy-legend-row { display:flex; align-items:center; gap:7px; }
.cy-legend-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.cy-legend-line { width:18px; height:0; border-top:2px solid; flex-shrink:0; }
.cy-toolbar { position:absolute; top:14px; left:14px; z-index:3; display:flex; gap:7px; }
.rel-side {
  border-left:1px solid var(--b1); background:var(--s1); display:flex; flex-direction:column; min-height:0; overflow:hidden;
}
.rel-side-head { flex-shrink:0; height:44px; padding:0 16px; display:flex; align-items:center;
  font-size:11px; font-weight:800; color:var(--t2); letter-spacing:.05em; text-transform:uppercase; border-bottom:1px solid var(--b1); }
.rel-side-body { flex:1; min-height:0; overflow-y:auto; padding:18px; scrollbar-width:thin; scrollbar-color:var(--b2) transparent; }
.rel-endpoints { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.rel-ep { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
.rel-ep-av {
  width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:800; border:2px solid var(--nc); color:var(--nc); background:rgba(96,165,250,.12);
}
.rel-ep-name { font-size:11.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.rel-arrow { font-size:20px; color:var(--ac); flex-shrink:0; }

/* range/slider */
.range-row { display:flex; align-items:center; gap:12px; }
.range-input { flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:99px; background:var(--s3); outline:none; }
.range-input::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:16px; height:16px; border-radius:50%; background:var(--ac); cursor:pointer; box-shadow:0 0 0 3px var(--ac-dim); }
.range-input::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:var(--ac); cursor:pointer; border:none; box-shadow:0 0 0 3px var(--ac-dim); }
.range-input:disabled { opacity:.5; cursor:not-allowed; }
.range-val { width:46px; text-align:right; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }

/* ─── TABLE (events) ─────────────────────────────── */
.data-table { width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; }
.data-table thead th {
  text-align:left; padding:10px 12px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  color:var(--t3); border-bottom:1px solid var(--b2); position:sticky; top:0; background:var(--s1); z-index:1;
}
.data-table tbody td { padding:11px 12px; border-bottom:1px solid var(--b1); vertical-align:top; line-height:1.5; }
.data-table tbody tr:hover { background:var(--s2); }
.imp-badge { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 7px;
  border-radius:99px; background:rgba(251,191,36,.12); color:var(--ne); font-size:11px; font-weight:700; }
.mini-chip { display:inline-block; padding:2px 7px; border-radius:99px; background:var(--s3); border:1px solid var(--b1); font-size:10px; color:var(--t2); margin:1px 2px 1px 0; }

/* picker grid (characters) */
.char-layout { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; align-items:start; }
.char-main { min-width:0; }
.char-roster {
  position:sticky; top:18px; max-height:calc(100vh - 120px); overflow:hidden;
  display:flex; flex-direction:column; border:1px solid var(--b1); border-radius:12px; background:var(--s1);
}
.char-roster-head { padding:14px 16px; border-bottom:1px solid var(--b1); }
.char-roster-title { font-size:13px; font-weight:800; }
.char-roster-sub { margin-top:4px; font-size:10.5px; color:var(--t3); line-height:1.5; }
.roster-columns { flex:1; min-height:0; display:grid; grid-template-rows:1fr 1fr; }
.roster-box { min-height:0; display:flex; flex-direction:column; border-bottom:1px solid var(--b1); }
.roster-box:last-child { border-bottom:0; }
.roster-box-head { flex-shrink:0; padding:10px 12px; font-size:10px; font-weight:800; color:var(--t3); text-transform:uppercase; letter-spacing:.05em; }
.roster-list { flex:1; min-height:120px; overflow-y:auto; padding:0 8px 8px; scrollbar-width:thin; scrollbar-color:var(--b2) transparent; }
.roster-list.drop { outline:1px dashed var(--ac); outline-offset:-4px; background:rgba(59,130,246,.06); }
.roster-item {
  width:100%; display:flex; align-items:center; gap:8px; margin-bottom:6px; padding:8px 9px;
  border:1px solid var(--b1); border-radius:9px; background:var(--s2); color:var(--t1); cursor:grab;
}
.roster-item:active { cursor:grabbing; }
.roster-item .ri-name { flex:1; min-width:0; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-weight:700; }
.roster-item .ri-id { font-size:9.5px; color:var(--t3); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.roster-move { width:24px; height:24px; border-radius:6px; border:1px solid var(--b2); background:var(--s3); color:var(--t2); cursor:pointer; }
.char-roster-foot { flex-shrink:0; padding:12px; border-top:1px solid var(--b1); display:flex; gap:8px; justify-content:flex-end; }
@media (max-width:980px){ .char-layout { grid-template-columns:1fr; } .char-roster { position:static; max-height:none; } }
@media (max-width:760px){
  .app-body { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
  .nav-panel { max-height:38vh; border-right:none; border-bottom:1px solid var(--b1); }
  .prompt-layout { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
  .tree-panel { max-height:32vh; border-right:none; border-bottom:1px solid var(--b1); }
  .editor-split { grid-template-columns:1fr; }
  .rel-layout { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; }
}
.picker-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:8px; }
.picker-card {
  display:flex; align-items:center; gap:11px; padding:13px 14px; border:1px solid var(--b1); border-radius:12px;
  background:var(--s1); cursor:pointer; text-align:left; font-family:inherit; color:var(--t1); transition:all .14s;
}
.picker-card:hover { border-color:var(--b3); background:var(--s2); }
.picker-card.active { border-color:rgba(59,130,246,.5); background:rgba(59,130,246,.1); }
.picker-av {
  width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; border:2px solid var(--nc); color:var(--nc); background:rgba(96,165,250,.12);
}
.picker-info { min-width:0; }
.picker-name { font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.picker-type { font-size:10.5px; color:var(--t3); text-transform:uppercase; letter-spacing:.04em; }

.scn-roster-empty { padding:24px 16px; text-align:center; color:var(--t3); font-size:12px; line-height:1.6; }

/* read-only info lists (items/goals/secrets/schedules) */
.info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.info-card2 { padding:13px 15px; border:1px solid var(--b1); border-radius:11px; background:var(--s2); }
.info-card2 .ic-title { font-size:12.5px; font-weight:700; overflow-wrap:anywhere; }
.info-card2 .ic-row { margin-top:5px; font-size:11px; color:var(--t2); line-height:1.5; overflow-wrap:anywhere; }
.info-card2 .ic-row b { color:var(--t3); font-weight:600; text-transform:uppercase; font-size:9.5px; letter-spacing:.04em; }
.subsec-title {
  margin:28px 0 14px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--t2);
  display:flex; align-items:center; gap:9px;
}
.subsec-title::before { content:""; width:3px; height:14px; border-radius:2px; background:var(--ac); flex-shrink:0; }
.subsec-title::after { content:""; flex:1; height:1px; background:var(--b1); }
.subsec-count { font-size:10px; color:var(--t3); font-weight:700; }

/* ─── TOASTS ─────────────────────────────────────── */
#toasts { position:fixed; top:64px; right:16px; z-index:500; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
@keyframes tst-in { from { opacity:0; transform:translateX(18px) scale(.96); } to { opacity:1; transform:translateX(0) scale(1); } }
@keyframes tst-out { from { opacity:1; transform:scale(1); } to { opacity:0; transform:scale(.94); } }
.toast {
  display:flex; align-items:flex-start; gap:9px; min-width:240px; max-width:380px; padding:11px 13px;
  border-radius:10px; border:1px solid var(--b2); background:rgba(12,17,26,.95); backdrop-filter:blur(10px);
  box-shadow:0 8px 28px rgba(0,0,0,.5); animation:tst-in .2s cubic-bezier(.34,1.36,.64,1);
  pointer-events:all; font-size:12px; color:var(--t1);
}
.toast.tout { animation:tst-out .25s ease forwards; }
.toast-ok { border-color:rgba(52,211,153,.25); }
.toast-er { border-color:rgba(248,113,113,.25); }
.toast-body { flex:1; line-height:1.5; overflow-wrap:anywhere; }
.toast-x { flex-shrink:0; background:none; border:none; color:var(--t3); font-size:14px; cursor:pointer; padding:0; font-family:inherit; }
.toast-x:hover { color:var(--t1); }

/* loading overlay for sections */
.section-loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:rgba(7,10,15,.62); backdrop-filter:blur(2px); z-index:20; }

/* ─── MODAL ──────────────────────────────────────── */
.modal-overlay {
  position:fixed; inset:0; z-index:600; display:flex; align-items:flex-start; justify-content:center;
  background:rgba(7,10,15,.74); backdrop-filter:blur(4px); padding:60px 18px 40px; overflow-y:auto;
  animation:tst-in .14s ease;
}
.modal {
  width:100%; max-width:520px; background:var(--s1); border:1px solid var(--b2); border-radius:16px;
  box-shadow:0 16px 60px rgba(0,0,0,.6), 0 0 0 1px var(--ac-glow); overflow:hidden;
}
.modal-head {
  display:flex; align-items:center; gap:10px; padding:18px 22px; border-bottom:1px solid var(--b1);
}
.modal-title { font-size:16px; font-weight:800; letter-spacing:-.01em; display:flex; align-items:center; gap:9px; }
.modal-x {
  margin-left:auto; width:30px; height:30px; border-radius:8px; border:1px solid var(--b2);
  background:var(--s2); color:var(--t2); font-size:16px; cursor:pointer; font-family:inherit;
  display:inline-flex; align-items:center; justify-content:center;
}
.modal-x:hover { color:var(--er); border-color:rgba(248,113,113,.4); }
.modal-body { padding:20px 22px; }
.modal-foot { display:flex; justify-content:flex-end; gap:9px; padding:16px 22px; border-top:1px solid var(--b1); background:var(--s1); }

/* inline create card */
.create-card { border:1px dashed rgba(59,130,246,.4); background:rgba(59,130,246,.04); }
.create-card .card-title { color:var(--ac); }

.divider { height:1px; background:var(--b1); margin:20px 0; }
.muted { color:var(--t3); }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.codebox {
  min-height:92px; max-height:220px; overflow:auto; padding:10px 12px;
  border:1px solid var(--b1); border-radius:8px; background:rgba(0,0,0,.24);
  color:var(--t2); font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap; overflow-wrap:anywhere;
}
</style>

"use strict";

/* ═══════════════════════════════════════════════════════════════════════

/* ─── PALETTE / CONSTANTS ────────────────────────────────────────────── */
const NODE_COL = { character:"#60a5fa", location:"#34d399", event:"#fbbf24", state:"#22d3ee", global:"#94a3b8", info:"#818cf8", fact:"#2dd4bf", rule:"#fb7185" };
const SECTIONS = [
  { id:"settings",      icon:"⚙", label:"설정",      en:"Settings", mode:"both" },
  { id:"prompts",       icon:"📝", label:"프롬프트",  en:"Prompts", mode:"both" },
  { id:"locations",     icon:"📍", label:"장소",      en:"Locations", mode:"world" },
  { id:"rules",         icon:"⚖️", label:"규칙",      en:"Rules", mode:"world" },
  { id:"characters",    icon:"👤", label:"캐릭터",    en:"Characters", mode:"both" },
  { id:"relationships", icon:"🔗", label:"관계",      en:"Relationships", mode:"scenario" },
  { id:"events",        icon:"⭐", label:"이벤트",    en:"Events", mode:"scenario" },
];
const BLOB_TABS_BASE = [
  { id:"static",      label:"Static",      role:"static",      sub:"불변 배경 (StaticInformation)" },
  { id:"personality", label:"Personality", role:"personality", sub:"성격 (drift 대상)" },
  { id:"info",        label:"Dynamic",     role:"info",        sub:"천천히 변하는 특성 (DynamicInformation)" },

// 현재 세계관의 EXTRA_SLOTS 를 포함한 전체 탭 목록을 반환합니다.
function getBlobTabs(){
  const extra = (state.extraSlots||[]).map(s=>({ id:s.id, label:s.label, role:s.id, sub:s.sub||s.label, custom:true }));
  return [...BLOB_TABS_BASE, ...extra];
}
// 하위 호환 alias: 코드 내 BLOB_TABS 참조는 모두 getBlobTabs() 로 교체됨.
// Standard keys surfaced first per blob role (from schema_editor_plan templates).
const STD_KEYS = {
  static:      ["birth_year","birthday","gender","nationality","origin_city","family","formative_background"],
  personality: ["core_traits","speech_style","dialogue_example"],
  info:        ["age","height","weight","measurements","appearance","body_type","skills","hobby","current_reputation","complex","ideal_type","sexual_information"],

function esc(v){ return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function attr(v){ return esc(v); }

function isObj(v){ return v!==null && typeof v==="object" && !Array.isArray(v); }
function fmtVal(v){ if(v===null||v===undefined)return""; if(typeof v==="object")return JSON.stringify(v); return String(v); }
function fmtValMulti(v){ if(v===null||v===undefined)return""; if(typeof v==="object")return JSON.stringify(v,null,2); return String(v); }

function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
// 자동저장 컨트롤러: 입력 후 ms(기본 3초) 디바운스 + 포커스아웃 flush. 변경분(dirty) 있을 때만 저장.
function makeAutosave(saveFn, ms=3000){
  let t=null, dirty=false;
  const schedule = ()=>{ dirty=true; clearTimeout(t); t=setTimeout(()=>{ t=null; if(dirty){ dirty=false; saveFn(); } }, ms); };
  const flush = ()=>{ clearTimeout(t); t=null; if(dirty){ dirty=false; saveFn(); } };
  const force = ()=>{ clearTimeout(t); t=null; dirty=false; saveFn(); };
  return { schedule, flush, force };
}
// container 하위 입력에 자동저장을 위임 바인딩(동적으로 추가된 필드도 버블링으로 포함).
function wireAutosave(container, ctrl){
  if(!container) return;
  container.addEventListener("input",  ctrl.schedule);   // 타이핑 → 디바운스
  container.addEventListener("change", ctrl.schedule);   // select/checkbox 등
  container.addEventListener("focusout", ctrl.flush);    // 포커스 아웃 → 즉시(변경분 있을 때만)
}
// 인라인 폼에 자동저장 부착. saveFn 은 quiet 저장 수행. guard()=false 면 컨텍스트 변경으로 스킵.
function attachAutosave(container, saveFn, guard){
  if(!container) return null;
  const ctrl = makeAutosave(()=>{ if(!guard || guard()) saveFn(); });
  wireAutosave(container, ctrl);
  return ctrl;
}

// Coerce a raw input string back toward its original JSON type for save payloads.
function coerceValue(raw, original){
  if(typeof original==="number"){ const n=Number(raw); return Number.isFinite(n)?n:raw; }
  if(typeof original==="boolean"){ const s=String(raw).trim().toLowerCase(); if(s==="true")return true; if(s==="false")return false; return raw; }
  if(Array.isArray(original)||isObj(original)){ try{ return JSON.parse(raw); }catch(_){ return raw; } }
  return raw;
}

async function apiGet(path){
  const r = await fetch(path, { cache:"no-store" });
  if(!r.ok){
    let detail = `HTTP ${r.status}`;
    try{ const j = await r.json(); if(j && j.detail) detail = j.detail; }catch(_){}
    throw new Error(detail);
  }
  return r.json();
}
async function apiSend(method, path, body){
  const r = await fetch(path, {
    method, headers:{ "Content-Type":"application/json" },
    body: body!==undefined ? JSON.stringify(body) : undefined,
  });
  // Write endpoints return 200 + SaveResult even on safe refusal; 4xx/5xx => {detail}
  if(!r.ok){
    let detail = `HTTP ${r.status}`;
    try{ const j = await r.json(); if(j && j.detail) detail = j.detail; }catch(_){}
    throw new Error(detail);
  }
  return r.json();
}
function qp(obj){
  const p = new URLSearchParams();
  for(const [k,v] of Object.entries(obj)) if(v!==null && v!==undefined && v!=="") p.set(k,v);
  const s = p.toString();
  return s ? "?"+s : "";
}

function setStatus(res, fallbackMsg){
  // res: SaveResult-like or null
  statusPill.classList.remove("ok","er");
  if(!res){ statusMsg.textContent = fallbackMsg || "준비됨"; statusBak.textContent=""; return; }
  const ok = !!res.ok;
  statusPill.classList.add(ok ? "ok" : "er");
  let msg = res.message || (ok ? "저장됨" : "저장 실패");
  if(res.formatted) msg += " · 리터럴이 재포맷됨";
  statusMsg.textContent = msg;
  statusMsg.title = msg;
  statusBak.textContent = res.backup ? ("백업: " + res.backup) : "";
  statusBak.title = res.backup || "";
}
function handleSaveResult(res, quiet=false){
  setStatus(res);
  // 자동저장(quiet)은 성공 토스트를 생략한다(거부/실패는 항상 알림).
  if(!quiet || !res.ok)
    toast((res.ok ? "" : "거부됨: ") + (res.message || (res.ok?"저장 완료":"저장 실패")) + (res.formatted?" (재포맷됨)":""), res.ok ? "ok" : "e");
  return res.ok;
}
function toast(msg, type="i"){

// onSubmit returns true to close. Reuses .btn / .save-btn / status styling.
function openModal(opts){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="modal-title">${opts.icon?`<span>${opts.icon}</span>`:""}${esc(opts.title||"")}</div>
      <button class="modal-x" type="button" data-modal-x title="닫기">×</button>
    </div>
    <div class="modal-body">${opts.bodyHtml||""}</div>
    <div class="modal-foot">
      <button class="btn" type="button" data-modal-cancel>취소</button>
      <button class="save-btn" type="button" data-modal-submit>${esc(opts.submitLabel||"생성")}</button>
    </div>
  </div>`;
  const close = ()=>{ overlay.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown", onKey);
  overlay.addEventListener("mousedown", e=>{ if(e.target===overlay) close(); });
  overlay.querySelector("[data-modal-x]").addEventListener("click", close);
  overlay.querySelector("[data-modal-cancel]").addEventListener("click", close);
  const submitBtn = overlay.querySelector("[data-modal-submit]");
  submitBtn.addEventListener("click", async ()=>{
    submitBtn.disabled=true; const orig=submitBtn.textContent; submitBtn.textContent="처리 중…";
    try{
      const done = await opts.onSubmit(overlay);
      if(done) close();
    }finally{ if(submitBtn.isConnected){ submitBtn.disabled=false; submitBtn.textContent=orig; } }
  });
  document.body.appendChild(overlay);
  if(opts.onMount) opts.onMount(overlay);
  const first = overlay.querySelector(".modal-body input,.modal-body select,.modal-body textarea");
  if(first) first.focus();
  return { overlay, close };
}

      <span class="nav-icon">${s.icon}</span>
      <span>${esc(s.label)}</span>
      ${c!==""&&c!==undefined?`<span class="nav-badge">${c}</span>`:""}
    </button>`;
  }).join("");
  navList.querySelectorAll("[data-section]").forEach(b=>{
    b.addEventListener("click",()=>switchSection(b.dataset.section));
  });
}
function countFiles(nodes){
  let n=0; const walk=arr=>arr.forEach(x=>{ if(x.is_dir){ if(x.children)walk(x.children); } else if(!x.missing) n++; });
  walk(nodes||[]); return n;
}

function switchSection(id){
  if(!visibleSections().some(s=>s.id===id)) id = "prompts";
  if(state.section===id && id!=="relationships") { /* allow re-render */ }
  if(state.promptDirty && state.section==="prompts" && id!=="prompts"){
    if(!confirm("저장하지 않은 프롬프트 변경사항이 있습니다. 이동하시겠습니까?")) return;
    state.promptDirty=false;
  }
  state.section = id;
  renderNav();
  renderSection();
}

function setEditorMode(mode){
  if(mode!=="world" && mode!=="scenario") return;
  // 시나리오 단계 진입 가드: 유효한 scenarioId 가 없으면 첫 시나리오로 확정한다
  // (시나리오 목록이 비면 scenarioId=null → 단일 'default' 시나리오로 동작).
  if(mode==="scenario" && (state.scenarioId??null)===null && state.scenarios.length){
    state.scenarioId = state.scenarios[0].scenario_id;
  }
  state.editorMode = mode;
  if(!visibleSections().some(s=>s.id===state.section)) state.section = "prompts";
  renderStepper();
  renderScenarioTabs();
  renderNav();
  renderSection();
}

// stepper 헤더를 현재 단계에 맞춰 그린다. 현재 단계 버튼은 active+disabled 로 표시하고,
// 다른 단계 버튼에 전이 핸들러를 단다. (#mode-toggle 자리를 재사용 — 별도 컴포넌트 없음.)
function renderStepper(){
  if(!state.worldId){ modeToggle.innerHTML = ""; return; }
  if(state.editorMode==="world"){
    modeToggle.innerHTML =
      `<button class="mode-btn active" type="button" disabled>① 세계관</button>`+
      `<button class="mode-btn" type="button" id="step-to-scn">② 시나리오 →</button>`;
    $("step-to-scn").addEventListener("click", enterScenarioStep);
  } else {
    modeToggle.innerHTML =
      `<button class="mode-btn" type="button" id="step-to-world">← ① 세계관</button>`+
      `<button class="mode-btn active" type="button" disabled>② 시나리오</button>`;
    $("step-to-world").addEventListener("click", enterWorldStep);
  }
}

// ② 시나리오 단계로 전진. dirty 편집이 있으면 경고하고, 유효 scenarioId 를 확보한 뒤 모드 전환.
function enterScenarioStep(){
  if(!confirmStepLeave()) return;
  if((state.scenarioId??null)===null && state.scenarios.length){
    state.scenarioId = state.scenarios[0].scenario_id;
  }
  setEditorMode("scenario");
}

// ① 세계관 단계로 복귀. dirty 편집이 있으면 경고.
function enterWorldStep(){
  if(!confirmStepLeave()) return;
  setEditorMode("world");
}

// 단계 전환 전 미저장 편집(프롬프트/로스터) 확인. 사용자가 취소하면 false 를 반환해 전환을 막는다.
function confirmStepLeave(){
  if(state.promptDirty){
    if(!confirm("저장하지 않은 프롬프트 변경사항이 있습니다. 단계를 이동하시겠습니까?")) return false;
    state.promptDirty = false;
  }
  if(state.rosterDirty){
    if(!confirm("저장하지 않은 로스터 변경사항이 있습니다. 단계를 이동하시겠습니까?")) return false;
    state.rosterDirty = false;
  }
  return true;
}

/* ─── WORLD / SCENARIO TOPBAR ────────────────────────────────────────── */
async function loadWorlds(selectId){
  try{
    const data = await apiGet("/api/worlds");
    state.worlds = data.worlds || [];
    worldSel.innerHTML = state.worlds.length
      ? state.worlds.map(w=>`<option value="${attr(w)}">${esc(w)}</option>`).join("")
      : `<option value="">(세계관 없음)</option>`;
    if(state.worlds.length){
      // prefer an explicitly requested world (e.g. just-created), else keep current, else first
      const pick = (selectId && state.worlds.includes(selectId)) ? selectId
                 : (state.worldId && state.worlds.includes(state.worldId)) ? state.worldId
                 : state.worlds[0];
      state.worldId = pick;
      worldSel.value = state.worldId;
      await onWorldChange();
    } else {
      renderStepper();   // 세계관이 없으면 stepper 비움
      renderSection();
    }
  }catch(err){
    worldSel.innerHTML = `<option value="">로드 실패</option>`;
    toast("세계관 목록 로드 실패: "+err.message, "e");
    renderFatal("세계관 목록을 불러오지 못했습니다", err.message);
  }
}

// scenarios 배열에서 extra_slots 를 추출합니다 (첫 번째 시나리오 기준).
function _extractExtraSlots(scenarios){
  if(!scenarios||!scenarios.length) return [];
  return scenarios[0].extra_slots || [];
}

// Re-fetch the current world's scenario list and (optionally) switch to selectSid.
async function reloadScenarios(selectSid, forceBundle=false){
  try{
    const data = await apiGet(`/api/worlds/${encodeURIComponent(state.worldId)}/scenarios`);
    state.scenarios = data.scenarios || [];
    state.extraSlots = _extractExtraSlots(data.scenarios);
  }catch(err){
    toast("시나리오 목록 재로드 실패: "+err.message, "e");
    return;
  }
  if(selectSid!==undefined && selectSid!==null){
    const found = state.scenarios.find(s=>(s.scenario_id??null)===(selectSid??null));
    if(found) state.scenarioId = found.scenario_id;
  } else if(state.scenarios.length && !state.scenarios.some(s=>(s.scenario_id??null)===(state.scenarioId??null))){
    state.scenarioId = state.scenarios[0].scenario_id;
  }
  renderScenarioTabs();
  await loadBundle(forceBundle);
}

function updateCurrentScenarioMeta(values){
  const sid = curSid();
  const idx = state.scenarios.findIndex(s=>(s.scenario_id??null)===(sid??null));
  if(idx < 0) return;
  state.scenarios[idx] = { ...state.scenarios[idx], ...values };
  renderScenarioTabs();
}

function updateSettingsMeta(values){
  if(state.editorMode==="scenario"){
    updateCurrentScenarioMeta(values);
    return;
  }
  const worldValues = { ...values };
  if(Object.prototype.hasOwnProperty.call(worldValues, "scene_types")){
    worldValues.world_scene_types = worldValues.scene_types;
    delete worldValues.scene_types;
  }
  if(Object.prototype.hasOwnProperty.call(worldValues, "perspective")){
    worldValues.world_perspective = worldValues.perspective;
    delete worldValues.perspective;
  }
  state.scenarios = state.scenarios.map(s=>({ ...s, ...worldValues }));
  renderScenarioTabs();
}

async function afterScenarioMetaSave(values, quiet, opts={}){
  if(quiet){
    updateCurrentScenarioMeta(values);
    if(opts.refreshPrompts) await refreshPromptsTree();
    return;
  }
  clearWorldCache();
  await reloadScenarios(curSid(), true);
  if(opts.refreshPrompts) await refreshPromptsTree();
  renderSettings();
}

async function afterSettingsMetaSave(values, quiet, opts={}){
  if(quiet){
    updateSettingsMeta(values);
    clearWorldCache();
    if(opts.refreshPrompts) await refreshPromptsTree();
    return;
  }
  clearWorldCache();
  await reloadScenarios(curSid(), true);
  if(opts.refreshPrompts) await refreshPromptsTree();
  renderSettings();
}

async function onWorldChange(){
  state.scenarioId = null;
  state.scenarios = [];
  state.allCharacters = [];
  state.scnCharIds = null;
  state.rosterKey = "";
  state.rosterDirty = false;
  state.editorMode = "world";   // 새 세계관 진입 시 항상 ① 세계관 단계에서 시작(진입 게이트)
  renderStepper();
  scnTabs.innerHTML = `<span class="muted" style="font-size:11px">시나리오 로딩…</span>`;
  metaWorld.textContent = state.worldId || "—";
  try{
    const data = await apiGet(`/api/worlds/${encodeURIComponent(state.worldId)}/scenarios`);
    state.scenarios = data.scenarios || [];
    state.extraSlots = _extractExtraSlots(data.scenarios);
    renderScenarioTabs();
    // 첫 시나리오를 내부 활성값으로 잡아 두지만(world-common 번들 로드용), UI 는 세계관 단계 유지.
    state.scenarioId = state.scenarios.length ? state.scenarios[0].scenario_id : null;
    renderScenarioTabs();
    await loadBundle();
  }catch(err){
    scnTabs.innerHTML = "";
    toast("시나리오 로드 실패: "+err.message, "e");
    state.scenarios = [];
    state.scenarioId = null;
    await loadBundle();
  }
}

function renderScenarioTabs(){
  if(state.editorMode==="world"){
    scnTabs.innerHTML = `<span class="muted" style="align-self:center">세계관 공통 편집 모드</span>`;
    metaScn.textContent = "world";
    metaPov.textContent = "—";
    return;
  }
  if(!state.scenarios.length){
    scnTabs.innerHTML = `<span class="muted" style="font-size:11px">기본 시나리오</span>`;
    metaScn.textContent = "default";
    return;
  }
  scnTabs.innerHTML = state.scenarios.map(s=>{
    const sid = s.scenario_id;
    const active = (state.scenarioId??null) === (sid??null);
    return `<button class="scn-tab${active?" active":""}" type="button" data-scn="${attr(sid??"__default__")}">${esc(s.display_name||sid||"기본")}</button>`;
  }).join("");
  scnTabs.querySelectorAll("[data-scn]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const raw = b.dataset.scn;
      const sid = raw==="__default__" ? null : raw;
      if((state.scenarioId??null) === (sid??null)) return;
      state.scenarioId = sid;
      state.scnCharIds = null;
      state.rosterKey = "";
      state.rosterDirty = false;
      renderScenarioTabs();
      await loadBundle();
    });
  });
  const cur = state.scenarios.find(s=>(s.scenario_id??null)===(state.scenarioId??null));
  metaScn.textContent = cur ? (cur.scenario_id || "default") : "—";
  if(cur){
    let pov = cur.perspective;
    let povStr = "—";
    if(Array.isArray(pov)) povStr = `${pov[0]}인칭 / ${pov[1]}`;
    else if(pov!==undefined && pov!==null) povStr = `${pov}인칭`;
    metaPov.textContent = povStr;
  }
}

/* ─── BUNDLE LOAD (graph #3 + prompts #4) ────────────────────────────── */
async function loadBundle(force=false){
  const key = cacheKey();
  if(!force && state.cache[key]){
    // reset transient per-section selections that may not exist in cached bundle
    ensureSelections();
    renderNav();
    renderSection();
    return;
  }
  state.cache[key] = state.cache[key] || {};
  renderSectionLoading();

  const scn = state.scenarioId;
  const gUrl = `/api/worlds/${encodeURIComponent(state.worldId)}/graph${qp({ scenario: scn })}`;
  const pUrl = `/api/worlds/${encodeURIComponent(state.worldId)}/prompts${qp({ scenario: scn })}`;

  const ftUrl = `/api/worlds/${encodeURIComponent(state.worldId)}/field-types`;
  const [gRes, pRes, ftRes] = await Promise.allSettled([ apiGet(gUrl), apiGet(pUrl), apiGet(ftUrl) ]);

  const bundle = state.cache[key];
  if(gRes.status==="fulfilled"){ bundle.graph = gRes.value; bundle.graphError = null; }
  else { bundle.graph = null; bundle.graphError = gRes.reason?.message || String(gRes.reason); }

  if(pRes.status==="fulfilled"){ bundle.prompts = pRes.value; bundle.promptError = null; }
  else { bundle.prompts = null; bundle.promptError = pRes.reason?.message || String(pRes.reason); }

  state.fieldTypes = ftRes.status==="fulfilled" ? (ftRes.value.data || {}) : {};

  ensureSelections();
  renderNav();
  renderSection();
}

function ensureSelections(){
  const g = curGraph();
  // character selection
  if(g?.characters?.length){
    if(!g.characters.some(c=>c.id===state.charId)) state.charId = g.characters[0].id;
  } else state.charId = "";
  // prompt selection persists only if path still present
  if(state.promptPath && curPrompts()){
    if(!findPromptNode(curPrompts().nodes, state.promptPath)){ state.promptPath=""; state.promptMeta=null; state.promptDirty=false; }
  }
  // edge selection
  state.selectedEdge = null;
}

async function refreshGraphOnly(){
  // After a structural write: re-fetch #3 only (server cache invalidated server-side).
  const key = cacheKey();
  const scn = state.scenarioId;
  const gUrl = `/api/worlds/${encodeURIComponent(state.worldId)}/graph${qp({ scenario: scn })}`;
  try{
    const g = await apiGet(gUrl);
    state.cache[key] = state.cache[key] || {};
    state.cache[key].graph = g;
    state.cache[key].graphError = null;
  }catch(err){
    if(state.cache[key]) state.cache[key].graphError = err.message;
    toast("그래프 재로드 실패: "+err.message, "e");
  }
  renderNav();
}

function renderSectionLoading(){
  sectionPane.innerHTML = `<div class="state-box" style="min-height:60vh">
    <div class="spinner"></div>
    <div class="state-text">그래프를 컴파일하는 중…</div>

  </div>`;
}
function renderFatal(title, body){
  sectionPane.innerHTML = `<div class="pane-inner"><div class="error-card">
    <div class="ec-title">⚠ ${esc(title)}</div>
    <div class="ec-body">${esc(body||"")}</div>
  </div></div>`;
}

function renderSection(){
  // Cleanup cytoscape if leaving relationships
  if(state.section!=="relationships" && state.cy){ try{ state.cy.destroy(); }catch(_){} state.cy=null; }
  if(state.section!=="prompts") disposeMonaco();

  if(!state.worldId){ renderFatal("세계관이 없습니다", "선택할 수 있는 세계관이 없습니다."); return; }

  switch(state.section){
    case "settings":      renderSettings(); break;
    case "prompts":       renderPrompts(); break;
    case "locations":     renderTupleSection("location"); break;
    case "rules":         renderTupleSection("rule"); break;
    case "characters":    renderCharacters(); break;
    case "relationships": renderRelationships(); break;
    case "events":        renderEvents(); break;
    default: renderFatal("알 수 없는 섹션", state.section);
  }
}

function graphErrorCard(){
  const b = curBundle();
  return `<div class="error-card">

  </div>`;
}

async function saveScenarioMeta(quiet=false){
  const input = $("scenario-display-input");
  const display_name = input.value.trim();
  if(!display_name){ if(!quiet) toast("display_name 을 입력하세요","e"); return; }
  const btn = $("scenario-meta-save");
  const orig = btn.textContent; btn.disabled = true; btn.textContent = "저장 중…";
  try{
    const res = await apiSend("PUT", `/api/worlds/${encodeURIComponent(state.worldId)}/scenarios/${encodeURIComponent(curSid())}`, { display_name });
    const ok = handleSaveResult(res, quiet);
    if(ok){
      await afterScenarioMetaSave({ display_name }, quiet);
    }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("시나리오 저장 실패: "+err.message,"e"); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=orig; } }
}

async function renameScenarioId(){
  const input = $("scenario-id-input");
  const new_scenario_id = (input?.value || "").trim();
  const oldSid = curSid();
  if(!new_scenario_id){ toast("scenario_id 를 입력하세요","e"); return; }
  if(new_scenario_id===oldSid){ toast("기존 scenario_id 와 같습니다","e"); return; }
  if(!confirm(`시나리오 id를 '${oldSid}' → '${new_scenario_id}' 로 변경할까요?`)) return;
  const btn = $("scenario-id-save");
  const orig = btn.textContent; btn.disabled = true; btn.textContent = "변경 중…";
  try{
    const oldKey = cacheKey();
    const res = await apiSend("PUT", `/api/worlds/${encodeURIComponent(state.worldId)}/scenarios/${encodeURIComponent(oldSid)}/id`, { new_scenario_id });
    const ok = handleSaveResult(res);
    if(ok){
      delete state.cache[oldKey];
      state.scenarioId = new_scenario_id;
      state.rosterKey = "";
      state.scnCharIds = null;
      await reloadScenarios(new_scenario_id);
      await loadBundle(true);
      renderSettings();
    }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("scenario_id 변경 실패: "+err.message,"e"); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=orig; } }
}

  try{
    const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/repair${qp({ scenario: curSid() })}`, {...issue, apply:false});

    const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/repair${qp({ scenario: curSid() })}`, {...issue, apply:true});

function normalizeScheduleTemplates(data){
  const out = {
    world:Array.isArray(data.world) ? data.world.map(normalizeScheduleEntry) : [],
    scenarios:{},
    note:String(data.note || "World Editor v1 data only. Runtime prompt integration is intentionally separate."),
  };
  if(data.scenarios && typeof data.scenarios==="object" && !Array.isArray(data.scenarios)){
    for(const [sid, entries] of Object.entries(data.scenarios)){
      out.scenarios[sid] = Array.isArray(entries) ? entries.map(normalizeScheduleEntry) : [];
    }
  }
  return out;
}

function normalizeScheduleEntry(entry){
  const src = entry && typeof entry==="object" && !Array.isArray(entry) ? entry : {};
  return {
    id:String(src.id || ""),
    name:String(src.name || ""),
    summary:String(src.summary || ""),
    tags:Array.isArray(src.tags) ? src.tags.map(String) : [],
    ...Object.fromEntries(Object.entries(src).filter(([k])=>!["id","name","summary","tags"].includes(k))),
  };
}

    </div>
    <div class="sched-list">${cards}</div>
  </div>`;
}

function scheduleTemplateEntry(scope, idx, entry){
  const extra = Object.fromEntries(Object.entries(entry).filter(([k])=>!["id","name","summary","tags","owner_id"].includes(k)));
  return `<div class="sched-entry" data-sched-template-entry data-scope="${attr(scope)}" data-index="${idx}">
    <div class="sched-entry-head">
      <div class="sched-entry-title mono">${esc(entry.id || "(new_schedule)")}</div>
      <button class="btn btn-sm btn-cancel" type="button" data-sched-template-scope="${attr(scope)}" data-sched-template-delete="${idx}">삭제</button>
    </div>
    <div class="field-2col">
      <div class="field"><label class="flabel">id</label><input class="finput mono" data-f="id" value="${attr(entry.id || "")}"></div>
      <div class="field"><label class="flabel">owner_id <span class="muted">필수 · 런타임 부착 대상</span></label><input class="finput mono" data-f="owner_id" value="${attr(entry.owner_id || "")}"></div>
    </div>
    <div class="field"><label class="flabel">name</label><input class="finput" data-f="name" value="${attr(entry.name || "")}"></div>
    <div class="field"><label class="flabel">summary</label><textarea class="ftext" data-f="summary" rows="2">${esc(entry.summary || "")}</textarea></div>
    <div class="field"><label class="flabel">tags <span class="muted">쉼표 구분</span></label><input class="finput" data-f="tags" value="${attr((entry.tags || []).join(", "))}"></div>
    <div class="field"><label class="flabel">추가 필드 JSON <span class="muted">recurrence / day_of_weeks / start_time / end_time / location_id …</span></label><textarea class="ftext mono" data-f="extra" rows="2">${esc(JSON.stringify(extra, null, 2))}</textarea></div>
  </div>`;
}

function addScheduleTemplateEntry(scope){
  if(!state.scheduleTemplates) return;
  const list = scheduleTemplateList(scope);
  list.push({ id:"", name:"", summary:"", tags:[] });
  renderScheduleTemplatesEditor();
}

function deleteScheduleTemplateEntry(scope, idx){
  if(!state.scheduleTemplates) return;
  const list = scheduleTemplateList(scope);
  if(idx < 0 || idx >= list.length) return;
  list.splice(idx, 1);
  renderScheduleTemplatesEditor();
}

function scheduleTemplateList(scope){
  const data = state.scheduleTemplates;
  if(scope==="world") return data.world;
  const sid = scope.replace(/^scenario:/, "");
  if(!data.scenarios[sid]) data.scenarios[sid] = [];
  return data.scenarios[sid];
}

function collectScheduleTemplates(){
  const host = $("schedule-templates-editor");
  if(!host || !state.scheduleTemplates) return null;
  const note = $("schedule-note")?.value || "";
  const data = { world:[], scenarios:{...state.scheduleTemplates.scenarios}, note };
  for(const key of Object.keys(data.scenarios)) data.scenarios[key] = [];
  host.querySelectorAll("[data-sched-template-entry]").forEach(card=>{
    const scope = card.dataset.scope || "world";
    const entry = {};
    card.querySelectorAll("[data-f]").forEach(el=>{
      const field = el.dataset.f;
      if(field==="tags") entry.tags = el.value.split(",").map(s=>s.trim()).filter(Boolean);
      else if(field==="extra"){
        const raw = el.value.trim();
        if(raw){
          let extra;
          try{ extra = JSON.parse(raw); }catch(err){ throwScheduleTemplateError("추가 필드 JSON 형식이 아닙니다: "+err.message); }
          if(!extra || typeof extra!=="object" || Array.isArray(extra)) throwScheduleTemplateError("추가 필드 JSON은 object 여야 합니다.");
          for(const key of ["id","name","summary","tags","owner_id"]) delete extra[key];
          Object.assign(entry, extra);
        }
      }
      else entry[field] = el.value.trim();
    });
    if(!entry.id){ throwScheduleTemplateError("스케줄 템플릿 id를 입력하세요."); }
    if(scope==="world") data.world.push(entry);
    else{
      const sid = scope.replace(/^scenario:/, "");
      if(!data.scenarios[sid]) data.scenarios[sid] = [];
      data.scenarios[sid].push(entry);
    }
  });
  return data;
}

function throwScheduleTemplateError(message){
  toast(message, "e");
  throw new Error(message);
}

      await apiSend("PATCH", `/api/worlds/${encodeURIComponent(state.worldId)}/field-types`, {section, field, type});
      if(!state.fieldTypes) state.fieldTypes = {};
      (state.fieldTypes[section] = state.fieldTypes[section] || {})[field] = type;
    }else{
      await apiSend("DELETE", `/api/worlds/${encodeURIComponent(state.worldId)}/field-types/${encodeURIComponent(section)}/${encodeURIComponent(field)}`);
      if(state.fieldTypes?.[section]) delete state.fieldTypes[section][field];
    }
  }catch(err){ toast("필드 타입 저장 실패: "+err.message, "e"); }
}

function collectSceneTypes(){
  // 화면의 행들을 {이름: 설명} dict 로 모은다. 빈 이름 행은 무시, 중복 키는 마지막 값.

  });

function mergeDefaultSceneTypes(defaults, current){
  return { ...(defaults || {}), ...(current || {}) };
}

async function addDefaultSceneTypes(){
  try{
    const data = await apiGet(`/api/worlds/${encodeURIComponent(state.worldId)}/scene_types/default`);
    const defaults = data.scene_types || {};
    const merged = mergeDefaultSceneTypes(defaults, collectSceneTypes());
    renderSceneTypeRows(merged);
    await saveSceneTypes(false);
  }catch(err){
    setStatus({ok:false,message:err.message});
    toast("기본 씬 타입 추가 실패: "+err.message, "e");

}

async function saveSceneTypes(quiet=false){
  const scene_types = collectSceneTypes();
  if(!Object.keys(scene_types).length){ if(!quiet) toast("씬 타입을 하나 이상 입력하세요","e"); return; }
  const btn = $("scene-types-save");
  const orig = btn.textContent; btn.disabled = true; btn.textContent = "저장 중…";
  try{
    const res = await apiSend("PUT", `/api/worlds/${encodeURIComponent(state.worldId)}/scene_types${qp({ scenario:settingsScenarioParam() })}`, { scene_types });
    const ok = handleSaveResult(res, quiet);
    if(ok){
      await afterSettingsMetaSave({ scene_types }, quiet, { refreshPrompts:true });
    }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("씬 타입 저장 실패: "+err.message,"e"); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=orig; } }
}

// perspective(int | [person,anchor] | [person,anchor,imp]) → {person, anchor, imp}
function parsePerspective(p){
  let person=3, anchor="char", imp=false;
  if(Array.isArray(p)){
    if(p.length>=1) person = Number(p[0])===1?1:3;
    if(p.length>=2){ const a=String(p[1]).toLowerCase(); anchor = (a==="user"||a==="pc")?"user":"char"; }
    if(p.length>=3) imp = !!p[2];
  } else { person = Number(p)===1?1:3; }
  if(person===1 && anchor==="user") imp=true;   // 제약
  return {person, anchor, imp};
}
// 1인칭+PC중심이면 사칭가능 고정(드롭다운 비활성)
function applyPovConstraint(){
  const forced = $("pov-person").value==="1" && $("pov-anchor").value==="user";
  const imp = $("pov-imp");
  if(forced){ imp.value="true"; imp.disabled=true; } else { imp.disabled=false; }
}
function setupPovSelects(p){
  const pp = parsePerspective(p);
  $("pov-person").value = String(pp.person);
  $("pov-anchor").value = pp.anchor;
  $("pov-imp").value = pp.imp ? "true" : "false";
  $("pov-person").addEventListener("change", applyPovConstraint);
  $("pov-anchor").addEventListener("change", applyPovConstraint);
  applyPovConstraint();
}
