async function deleteRelationship(source, target, srcName, tgtName){
  if(!confirm(`'${srcName||source}' → '${tgtName||target}' 관계를 삭제할까요? (반대 방향 B→A 는 영향받지 않습니다.)`)) return;
  const btn = $("rel-delete"); if(btn){ btn.disabled=true; btn.textContent="삭제 중…"; }
  try{
    const res = await apiSend("DELETE", `/api/worlds/${encodeURIComponent(state.worldId)}/relationship${qp({ source, target })}`);
    const ok = handleSaveResult(res);
    if(ok){ state.selectedEdge=null; await refreshGraphOnly(); renderRelationships(); }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("삭제 실패: "+err.message,"e"); }
  finally{ if($("rel-delete")){ $("rel-delete").disabled=false; $("rel-delete").textContent="🗑 관계 삭제"; } }
}
function linkRange(rangeId, numId){
  const r=$(rangeId), n=$(numId);
  if(!r||!n) return;
  r.addEventListener("input",()=>{ n.value=r.value; });
  n.addEventListener("input",()=>{ r.value=clamp(n.value,0,100); });
}
function nameOf(g, id){
  const c = (g.characters||[]).find(x=>x.id===id);
  return c ? (c.name||c.id) : id;
}

function newRelForm(g){
  const opts = (g.characters||[]).map(c=>`<option value="${attr(c.id)}">${esc(c.name||c.id)}</option>`).join("");
  return `<div class="field-grid">
    <div class="field-2col">
      <div class="field"><label class="flabel">source</label><select class="fselect" id="nr-src">${opts}</select></div>
      <div class="field"><label class="flabel">target</label><select class="fselect" id="nr-tgt">${opts}</select></div>
    </div>
    <div class="field"><label class="flabel">관계 유형 rel_type</label><input class="finput" id="nr-type" placeholder="예: best_friend"></div>
    <div class="field-2col">
      <div class="field"><label class="flabel">affinity</label><input class="finput num" id="nr-aff" type="number" min="0" max="100" value="0"></div>
      <div class="field"><label class="flabel">trust</label><input class="finput num" id="nr-trust" type="number" min="0" max="100" value="20"></div>
    </div>
    <div class="field"><label class="flabel">current_status</label><textarea class="ftext" id="nr-status" rows="3"></textarea></div>
    <button class="save-btn" id="nr-save" style="justify-content:center">+ 관계 생성 / 갱신</button>
  </div>`;
}
function wireNewRel(g){
  const btn = $("nr-save");
  if(!btn) return;
  // default target to a different char
  const tgt=$("nr-tgt");
  if(tgt && tgt.options.length>1) tgt.selectedIndex=1;
  btn.addEventListener("click", async ()=>{
    const source=$("nr-src").value, target=$("nr-tgt").value;
    if(!source||!target){ toast("source / target 를 선택하세요","e"); return; }
    if(source===target){ toast("source 와 target 이 같습니다","e"); return; }
    const body = {
      source, target,
      rel_type: $("nr-type").value.trim() || undefined,
      affinity: numOrUndef($("nr-aff").value),
      trust: numOrUndef($("nr-trust").value),
      current_status: $("nr-status").value.trim() || undefined,
    };
    btn.disabled=true; btn.textContent="저장 중…";
    try{
      const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/relationship`, body);
      const ok = handleSaveResult(res);
      if(ok){ await refreshGraphOnly(); renderRelationships(); }
    }catch(err){ setStatus({ok:false,message:err.message}); toast("저장 실패: "+err.message,"e"); }
    finally{ if($("nr-save")){ $("nr-save").disabled=false; $("nr-save").textContent="+ 관계 생성 / 갱신"; } }
  });
}
function numOrUndef(v){ const s=String(v).trim(); if(s==="") return undefined; const n=Number(s); return Number.isFinite(n)?n:undefined; }

async function saveRelationship(source, target, quiet=false){
  const body = {
    source, target,
    rel_type: $("rel-type").value.trim() || undefined,
    affinity: numOrUndef($("rel-aff-num").value),
    trust: numOrUndef($("rel-trust-num").value),
    current_status: $("rel-status").value,
  };
  const btn = $("rel-save"); btn.disabled=true; const orig=btn.textContent; btn.textContent="저장 중…";
  try{
    const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/relationship`, body);
    const ok = handleSaveResult(res, quiet);
    if(ok){ await refreshGraphOnly(); if(!quiet) renderRelationships(); }
  }catch(err){ setStatus({ok:false,message:err.message}); toast("저장 실패: "+err.message,"e"); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=orig; } }
}

function renderRelFallback(g){
  // Cytoscape CDN failed → table fallback that still allows editing
  const rels = g.relationships || [];
  const host = $("rel-side-body");
  const cyWrap = document.querySelector(".cy-wrap");
  cyWrap.innerHTML = `<div class="pane-inner" style="padding:24px">
    <div class="banner banner-warn"><span class="banner-icon">⚠</span><div>Cytoscape 를 불러오지 못했습니다 (네트워크/CDN 차단 가능). 표 형태로 표시합니다. <button class="btn btn-sm" id="cy-retry" style="margin-left:8px">↻ 재시도</button></div></div>
    ${rels.length?`<table class="data-table"><thead><tr><th>source</th><th>→</th><th>target</th><th>type</th><th>affinity</th><th>trust</th><th></th></tr></thead>
    <tbody>${rels.map((r,i)=>`<tr data-rel="${i}">
      <td>${esc(nameOf(g,r.source))}</td><td class="muted">→</td><td>${esc(nameOf(g,r.target))}</td>
      <td>${esc(r.type||"")}</td>
      <td><span style="color:${scoreColor(r.affinity)}">${esc(r.affinity??"")}</span></td>
      <td><span style="color:${scoreColor(r.trust)}">${esc(r.trust??"")}</span></td>
      <td>${r.editable!==false?`<button class="btn btn-sm" data-edit-rel="${i}">편집</button>`:`<span class="ro-note">읽기 전용</span>`}</td>
    </tr>`).join("")}</tbody></table>`:`<div class="state-box"><div class="state-text">관계 없음</div></div>`}
  </div>`;
  cyWrap.querySelectorAll("[data-edit-rel]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const r = rels[Number(b.dataset.editRel)];
      state.selectedEdge = { source:r.source, target:r.target };
      renderEdgePanel({ source:r.source, target:r.target, label:r.type, affinity:r.affinity, trust:r.trust, editable:r.editable });
    });
  });
  const retryBtn = cyWrap.querySelector("#cy-retry");
  if(retryBtn) retryBtn.addEventListener("click", retryCytoscape);
  renderEdgePanel(null);
}

function retryCytoscape(){
  // 이미 로드돼 있으면 곧장 재렌더, 아니면 CDN 스크립트를 다시 주입한다.
  if(window.cytoscape){ renderRelationships(); return; }
  const btn = $("cy-retry");
  if(btn){ btn.disabled = true; btn.textContent = "불러오는 중…"; }
  const script = document.createElement("script");
  script.src = "https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js";
  script.onload = ()=>{
    if(window.cytoscape){ toast("Cytoscape 로드 성공", "ok"); renderRelationships(); }
    else { toast("스크립트는 받았으나 cytoscape 전역이 없습니다", "e"); if(btn){ btn.disabled=false; btn.textContent="↻ 재시도"; } }
  };
  script.onerror = ()=>{ toast("Cytoscape 로드 실패 — 네트워크/CDN 차단 확인", "e"); if(btn){ btn.disabled=false; btn.textContent="↻ 재시도"; } };
  document.head.appendChild(script);
}

async function deleteEvent(eventId, btn){
  const ev = (curGraph()?.events||[]).find(e=>e.id===eventId);
  if(!confirm(`'${ev?.summary||eventId}' 이벤트를 삭제할까요? 되돌릴 수 없습니다.`)) return;
  if(btn){ btn.disabled=true; btn.textContent="…"; }
  try{
    const res = await apiSend("DELETE", `/api/worlds/${encodeURIComponent(state.worldId)}/events/${encodeURIComponent(eventId)}`);
    const ok = handleSaveResult(res);
    if(ok) await refreshGraphOnly().then(()=> renderEvents());
  }catch(err){ setStatus({ok:false,message:err.message}); toast("삭제 실패: "+err.message,"e"); }
  finally{ if(btn&&btn.isConnected){ btn.disabled=false; btn.textContent="🗑"; } }
}

function openNewEventModal(g){
  const chars = g.characters || [];
  const locs = g.locations || [];
  const charOpts = chars.map(c=>`<option value="${attr(c.id)}">${esc(c.name||c.id)}</option>`).join("");
  const locOpts = `<option value="">(없음)</option>` + locs.map(l=>`<option value="${attr(l.id)}">${esc(l.name||l.id)}</option>`).join("");
  openModal({
    title:"새 이벤트", icon:"⭐", submitLabel:"이벤트 생성",
    bodyHtml:`<div class="field-grid">
      <div class="field-2col">
        <div class="field"><label class="flabel">id <span class="muted">(소문자·숫자·_)</span></label><input class="finput mono" id="ne-id" placeholder="예: festival_kiss" autocapitalize="off" spellcheck="false"></div>
        <div class="field"><label class="flabel">시점 timestamp</label><input class="finput" id="ne-ts" type="datetime-local"></div>
      </div>
      <div class="field"><label class="flabel">요약 summary</label><textarea class="ftext" id="ne-summary" placeholder="무슨 일이 있었는가"></textarea></div>
      <div class="field"><label class="flabel">임팩트 impact</label><input class="finput" id="ne-impact" placeholder="이 이벤트의 영향"></div>
      <div class="field-3col">
        <div class="field"><label class="flabel">중요도 importance</label><input class="finput num" id="ne-importance" type="number" min="0" max="100" value="50"></div>
        <div class="field"><label class="flabel">기억유형 memory_type</label><select class="fselect" id="ne-mtype"><option value="episodic">episodic</option><option value="relational">relational</option><option value="emotional">emotional</option></select></div>
        <div class="field"><label class="flabel">감쇠율 decay_rate</label><input class="finput num" id="ne-decay" type="number" min="0" max="1" step="0.01" value="0.1"></div>
      </div>
      <div class="field-2col">
        <div class="field"><label class="flabel">관련 캐릭터 involved <span class="muted">(다중 선택)</span></label>
          <select class="fselect" id="ne-involved" multiple size="${Math.min(Math.max(chars.length,3),6)}" ${chars.length?"":"disabled"}>${charOpts||""}</select>
          ${chars.length?`<div class="fhint">Ctrl/Cmd 클릭으로 여러 명 선택</div>`:`<div class="fhint">캐릭터가 없습니다</div>`}
        </div>
        <div class="field"><label class="flabel">장소 location_id</label><select class="fselect" id="ne-loc">${locOpts}</select></div>
      </div>
    </div>`,
    onMount(root){
      const idEl = root.querySelector("#ne-id");
      idEl.addEventListener("input", ()=>{ idEl.value = idEl.value.toLowerCase().replace(/[^a-z0-9_]/g,""); });
    },
    async onSubmit(root){
      const id = root.querySelector("#ne-id").value.trim();
      const summary = root.querySelector("#ne-summary").value.trim();
      if(!id){ toast("id 를 입력하세요","e"); return false; }
      if(!ID_RE.test(id)){ toast("id 는 소문자·숫자·_ 만 가능합니다","e"); return false; }
      if(!summary){ toast("요약을 입력하세요","e"); return false; }
      const involved = [...root.querySelector("#ne-involved").selectedOptions].map(o=>o.value);
      const event = {
        id, summary,
        timestamp: root.querySelector("#ne-ts").value || "",
        importance: clamp(root.querySelector("#ne-importance").value, 0, 100),
        impact: root.querySelector("#ne-impact").value.trim(),
        memory_type: root.querySelector("#ne-mtype").value,
        decay_rate: clamp(root.querySelector("#ne-decay").value, 0, 1),
        involved,
        location_id: root.querySelector("#ne-loc").value || "",
      };
      try{
        const res = await apiSend("POST", `/api/worlds/${encodeURIComponent(state.worldId)}/events`, { event });
        const ok = handleSaveResult(res);
        if(ok){ await refreshGraphOnly().then(()=> renderEvents()); return true; }
        return false;
      }catch(err){ setStatus({ok:false,message:err.message}); toast("이벤트 생성 실패: "+err.message,"e"); return false; }
    },
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   BINDINGS / BOOT
   ═══════════════════════════════════════════════════════════════════════ */
worldSel.addEventListener("change", async ()=>{
  if(state.promptDirty){ if(!confirm("저장하지 않은 변경사항이 있습니다. 세계관을 바꾸시겠습니까?")) { worldSel.value=state.worldId; return; } state.promptDirty=false; }
  state.worldId = worldSel.value;
  state.promptPath=""; state.promptMeta=null;
  await onWorldChange();
});
$("new-world-btn").addEventListener("click", openNewWorldModal);
$("new-scn-btn").addEventListener("click", openNewScenarioModal);
$("refresh-btn").addEventListener("click", async ()=>{
  setStatus(null, "새로고침 중…");
  await loadBundle(true);
  if(state.section==="prompts" && state.promptPath){
    // reload the open file too
    const wasMissing = state.promptMeta?._missing;
    await openPromptFile(state.promptPath, wasMissing);
  }
  setStatus(null, "새로고침 완료");
  toast("다시 불러왔습니다", "ok");
});
window.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){
    if(state.section==="prompts" && state.promptDirty){ e.preventDefault(); savePromptFile(); }
  }
});
window.addEventListener("beforeunload", e=>{
  if(state.promptDirty){ e.preventDefault(); e.returnValue=""; }
});

async function boot(){
  renderNav();
  renderSectionLoading();
  await loadWorlds();
}
boot();
</script>
</body>
</html>
